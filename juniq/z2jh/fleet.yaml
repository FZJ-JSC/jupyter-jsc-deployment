defaultnamespace: juniq

labels:
  app: juniq
  component: z2jh

dependsOn:
  - selector:
      matchLabels:
        app: juniq
        component: secrets
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces
  - selector:
      matchLabels:
        app: postgres-operator
        component: databases

kustomize:
  dir: ./kustomize
helm:
  releaseName: juniq
  # repo: https://jupyterhub.github.io/helm-chart/
  # chart: jupyterhub
  # version: 3.1.0
  chart: https://github.com/jupyterhub/helm-chart/raw/gh-pages/jupyterhub-3.3.8.tgz
  values:
    ingress:
      # Set JupyterHub in maintenance:
      #   Set enabled here to false, update ingress in maintenance/fleet.yaml
      enabled: true
  valuesFiles:
    - ../../base-values/extraConfig.yaml
    - ../../base-values/image.yaml
  valuesFrom:
    - configMapKeyRef:
        name: values
        namespace: juniq
        key: values.yaml
    - secretKeyRef:
        name: static-hub-secret
        namespace: juniq
        key: values.yaml

targetCustomizations:
  - name: production
    clusterSelector:
      matchLabels:
        stage: production
    helm:
      valuesFiles:
        - ../../base-values/image_fixed.yaml
    kustomize:
      dir: ./kustomize-maint
  - name: staging
    clusterSelector:
      matchLabels:
        stage: staging
    helm:
      valuesFiles:
        # - ../../base-values/image_devel.yaml
        - ../../base-values/image.yaml
