defaultNamespace: juniq

labels:
  app: juniq
  component: custom

dependsOn:
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces

helm:
  releaseName: juniq-custom
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-hub-customizations
  version: 0.15.2
  values:
    fullnameOverride: juniq-custom
    global:
      name: juniq
      namespace: juniq
    ingress:
      enabled: true
    jupyter-metrics:
      enabled: true
      nodeSelector:
        worker: "true"
    logging:
      syslog:
        enabled: true
        level: 10
targetCustomizations:
  - name: jupyter-stag
    clusterSelector:
      matchLabels:
        stage: staging
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: juniq-staging.fz-juelich.de
          baseUrl: /
          loggerName: JuniqStaging
        nfs:
          path: /nfs/hubs/rke2/staging/juniq
  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: juniq.fz-juelich.de
          baseUrl: /
          loggerName: Juniq
        nfs:
          path: /nfs/hubs/rke2/production/juniq