---
defaultNamespace: juniq

labels:
  app: juniq
  component: custom

dependsOn:
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces

helm:
  releaseName: juniq-custom
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-hub-customizations
  version: 0.24.4
  values:
    fullnameOverride: juniq-custom
    customConfig:
      services:
        JupyterLab:
          defaultOption: "4.2-juniq"
          "4.3":
            enabled: false
          "4.2":
            enabled: false
          "4.3-juniq":
            enabled: true
          "4.2-juniq":
            enabled: true
          "3.6":
            enabled: false
          "3.6-juniq":
            enabled: true
    global:
      name: juniq
      namespace: juniq
    dailyRestart:
      enabled: false
    jupyter-metrics:
      enabled: true
      nodeSelector:
        worker: "true"
    logging:
      syslog:
        enabled: true
        level: 10
targetCustomizations:
  - name: jupyter-stag
    clusterSelector:
      matchLabels:
        stage: staging
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: juniq-staging.fz-juelich.de
          baseUrl: /
          loggerName: JuniqStaging
        sidecarCheckInterval: 1200
        nfs:
          path: /nfs/hubs/rke2/staging/juniq
  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
        maintenance: "false"
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: juniq.fz-juelich.de
          baseUrl: /
          loggerName: Juniq
        nfs:
          path: /nfs/hubs/rke2/production/juniq
  - name: jupyter-prod-maintenance
    clusterSelector:
      matchLabels:
        stage: production
        maintenance: "true"
    helm:
      values:
        ingress:
          certmanager: false
        global:
          hostname: zam12154.zam.kfa-juelich.de
          # hostname: juniq.fz-juelich.de
          baseUrl: /juniq/
          loggerName: Juniq
          tlssecretname: zam12154
        nfs:
          path: /nfs/hubs/rke2/production/juniq
