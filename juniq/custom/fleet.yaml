defaultNamespace: juniq

labels:
  app: juniq
  component: custom

dependsOn:
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces

helm:
  releaseName: juniq-custom
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-hub-customizations
  version: 0.15.14
  values:
    fullnameOverride: juniq-custom
    customConfig:
      announcement:
        show: true
        title: "Scheduled maintenance on November, 4th"
        body: "Please be advised that our webservice will be undergoing scheduled maintenance on November 4, 2024, from 9:00 AM to 12:00 PM. During this time, the webservice will be unavailable."
      services:
        JupyterLab:
          defaultOption: "JupyterLab/4.2-juniq"
          "4.2":
            enabled: false
          "4.2-juniq":
            enabled: true
          "3.6":
            enabled: false
          "3.6-juniq":
            enabled: true
    global:
      name: juniq
      namespace: juniq
    ingress:
      enabled: true
    jupyter-metrics:
      enabled: true
      nodeSelector:
        worker: "true"
    logging:
      syslog:
        enabled: true
        level: 10
targetCustomizations:
  - name: jupyter-stag
    clusterSelector:
      matchLabels:
        stage: staging
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: juniq-staging.fz-juelich.de
          baseUrl: /
          loggerName: JuniqStaging
        nfs:
          path: /nfs/hubs/rke2/staging/juniq
  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
        prep: "false"
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: juniq.fz-juelich.de
          baseUrl: /
          loggerName: Juniq
        nfs:
          path: /nfs/hubs/rke2/production/juniq
  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
        prep: "true"
    helm:
      values:
        ingress:
          certmanager: false
        global:
          hostname: zam12185.zam.kfa-juelich.de
          # hostname: juniq.fz-juelich.de
          baseUrl: /juniq/
          loggerName: Juniq
          tlssecretname: zam12185
        nfs:
          path: /nfs/hubs/rke2/production/juniq
