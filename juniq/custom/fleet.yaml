defaultNamespace: juniq

labels:
  app: juniq
  component: custom

dependsOn:
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces

helm:
  releaseName: juniq-custom
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-hub-customizations
  version: 0.15.38
  values:
    fullnameOverride: juniq-custom
    customConfig:
      announcement:
        show: true
        title: "Upcoming Maintenance - 20 Mar 2025 08.30 - 18.30"
        body: "All running JupyterLabs will be stopped during this maintenance."
      services:
        JupyterLab:
          defaultOption: "4.2-juniq"
          "4.2":
            enabled: false
          "4.2-juniq":
            enabled: true
          "3.6":
            enabled: false
          "3.6-juniq":
            enabled: true
    global:
      name: juniq
      namespace: juniq
    dailyRestart:
      enabled: false
    ingress:
      enabled: true
    jupyter-metrics:
      enabled: true
      nodeSelector:
        worker: "true"
    logging:
      syslog:
        enabled: true
        level: 10
targetCustomizations:
  - name: jupyter-stag
    clusterSelector:
      matchLabels:
        stage: staging
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: juniq-staging.fz-juelich.de
          baseUrl: /
          loggerName: JuniqStaging
        nfs:
          path: /nfs/hubs/rke2/staging/juniq
  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
        prep: "false"
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: juniq.fz-juelich.de
          baseUrl: /
          loggerName: Juniq
        nfs:
          path: /nfs/hubs/rke2/production/juniq
        redirectEditInPlace: "false"
        redirects:
          - name: "production-docs"
            oldHost: "docs.juniq.fz-juelich.de"
            newHost: "jupyterjsc.pages.jsc.fz-juelich.de/docs/juniq/"
  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
        prep: "true"
    helm:
      values:
        ingress:
          certmanager: false
        global:
          hostname: zam12185.zam.kfa-juelich.de
          # hostname: juniq.fz-juelich.de
          baseUrl: /juniq/
          loggerName: Juniq
          tlssecretname: zam12185
        nfs:
          path: /nfs/hubs/rke2/production/juniq
