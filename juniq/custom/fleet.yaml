---
defaultNamespace: juniq

labels:
  app: juniq
  component: custom

dependsOn:
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces

helm:
  releaseName: juniq-custom
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-hub-customizations
  version: 0.25.13
  values:
    livenessProbe:
      enabled: false
    fullnameOverride: juniq-custom
    customConfig:
      workshopcredits:
        ion_hack_2026:
          priority: 10
          enabled: true
          start: "2026-03-12 14:00"
          end: "2026-03-15 20:30"
          credits:
            cap: 800
            grant_interval: 3600
            grant_value: 800
            user_options:
              system: JSC-Cloud
        qsolid-bull:
          priority: 1
          enabled: true
          start: "2026-02-20 08:00"
          end: "2026-12-31 18:30"
          credits:
            cap: 1000
            grant_interval: 86400
            grant_value: 1000
            user_options:
              system: JSC-Cloud
      services:
        JupyterLab:
          defaultOption: "4.2-juniq"
          "4.3":
            enabled: false
          "4.2":
            enabled: false
          "4.3-juniq":
            enabled: true
          "4.2-juniq":
            enabled: true
          "3.6":
            enabled: false
          "3.6-juniq":
            enabled: true
    global:
      name: juniq
      namespace: juniq
    dailyRestart:
      enabled: false
    jupyter-metrics:
      enabled: true
      nodeSelector:
        worker: "true"
    logging:
      syslog:
        enabled: true
        level: 10
targetCustomizations:
  - name: jupyter-stag
    clusterSelector:
      matchLabels:
        stage: staging
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: juniq-staging.fz-juelich.de
          baseUrl: /
          loggerName: JuniqStaging
        sidecarCheckInterval: 1200
        nfs:
          path: /nfs/hubs/rke2/staging/juniq
  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
        maintenance: "false"
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: juniq.fz-juelich.de
          baseUrl: /
          loggerName: Juniq
        nfs:
          path: /nfs/hubs/rke2/production/juniq
  - name: jupyter-prod-maintenance
    clusterSelector:
      matchLabels:
        stage: production
        maintenance: "true"
    helm:
      values:
        ingress:
          certmanager: false
        global:
          hostname: zam12154.zam.kfa-juelich.de
          # hostname: juniq.fz-juelich.de
          baseUrl: /juniq/
          loggerName: Juniq
          tlssecretname: zam12154
        nfs:
          path: /nfs/hubs/rke2/production/juniq
