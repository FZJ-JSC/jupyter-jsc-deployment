---
defaultnamespace: dev1

labels:
  app: dev1
  component: z2jh

dependsOn:
  - selector:
      matchLabels:
        app: dev1
        component: secrets
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces

kustomize:
  dir: ./kustomize
helm:
  releaseName: dev1
  # repo: https://jupyterhub.github.io/helm-chart/
  # chart: jupyterhub
  # version: 3.1.0
  chart: https://github.com/jupyterhub/helm-chart/raw/gh-pages/jupyterhub-4.2.0.tgz
  values:
    ingress:
      # Set JupyterHub in maintenance:
      #   Set enabled here to false, update ingress in maintenance/fleet.yaml
      enabled: true
    hub:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 300m
          memory: 1024Mi
    proxy:
      chp:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 1024Mi
  valuesFiles:
    - ../../base-values/extraConfig.yaml
    - ../../base-values/image.yaml
  valuesFrom:
    - configMapKeyRef:
        name: values
        namespace: dev1
        key: values.yaml
    - secretKeyRef:
        name: static-hub-secret
        namespace: dev1
        key: values.yaml

targetCustomizations:
  - name: production
    clusterSelector:
      matchLabels:
        stage: production
    doNotDeploy: true
