---
defaultNamespace: dev1

labels:
  app: dev1
  component: custom

dependsOn:
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces

helm:
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-hub-customizations
  version: 0.16.68
  values:
    fullnameOverride: dev1-custom
    global:
      name: dev1
      namespace: dev1
    ingress:
      enabled: true
    jupyter-metrics:
      enabled: true
      nodeSelector:
        worker: "true"
    logging:
      syslog:
        enabled: true
        level: 10
    customConfig:
      reservationCheck:
        addUsers: ["petrova1", "kreuzer1"]
        setAllActive: true
      authStateKeys:
        - services
        - userModules
        - backendServices
        - announcement
        - groups
        - systems
        - incidentCheck
        - binderRepos
      binderRepos:
        repos:
          - GitHub
targetCustomizations:
  - name: jupyter-stag
    clusterSelector:
      matchLabels:
        stage: staging
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: jupyter-jsc-dev1.fz-juelich.de
          baseUrl: /
          loggerName: JupyterDev1
        nfs:
          path: /nfs/hubs/rke2/staging/dev1

  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
    doNotDeploy: true
