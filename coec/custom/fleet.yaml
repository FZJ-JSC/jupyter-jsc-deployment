---
defaultNamespace: coec

labels:
  app: coec
  component: custom

dependsOn:
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces

helm:
  releaseName: coec-custom
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-hub-customizations
  version: 0.16.41
  values:
    fullnameOverride: coec-custom
    global:
      name: coec
      namespace: coec
    dailyRestart:
      enabled: false
    ingress:
      enabled: true
    jupyter-metrics:
      enabled: true
      nodeSelector:
        worker: "true"
    logging:
      syslog:
        enabled: true
        level: 10
    customConfig:
      services:
        JupyterLab:
          "4.2":
            enabled: false
          "3.6":
            enabled: false
          "xpra":
            enabled: false
targetCustomizations:
  - name: jupyter-stag
    clusterSelector:
      matchLabels:
        stage: staging
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: jupyter-coec-staging.jsc.fz-juelich.de
          baseUrl: /
          loggerName: CoeCStaging
        nfs:
          path: /nfs/hubs/rke2/staging/coec
  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
        maintenance: "false"
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: jupyter-coec.jsc.fz-juelich.de
          baseUrl: /
          loggerName: CoeC
        nfs:
          path: /nfs/hubs/rke2/production/coec
        redirectEditInPlace: "false"
        redirects:
          - name: "production-docs"
            oldHost: "docs.jupyter-coec.jsc.fz-juelich.de"
            newHost: "jupyterjsc.pages.jsc.fz-juelich.de/docs/jupyterjsc/"
  - name: jupyter-prod-maintenance
    clusterSelector:
      matchLabels:
        stage: production
        maintenance: "true"
    helm:
      values:
        ingress:
          certmanager: false
        global:
          hostname: zam12154.zam.kfa-juelich.de
          # hostname: jupyter-coec.jsc.fz-juelich.de
          baseUrl: /coec/
          loggerName: CoeC
          tlssecretname: zam12154
        nfs:
          path: /nfs/hubs/rke2/production/coec
