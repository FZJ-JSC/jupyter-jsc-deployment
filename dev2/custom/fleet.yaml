defaultNamespace: dev2

labels:
  app: dev2
  component: custom

dependsOn:
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces

helm:
  releaseName: dev2-custom
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-hub-customizations
  version: 0.15.15
  values:
    fullnameOverride: dev2-custom
    global:
      name: dev2
      namespace: dev2
      loggerName: JupyterDev2
    ingress:
      enabled: true
    jupyter-metrics:
      enabled: true
      nodeSelector:
        worker: "true"
    logging:
      syslog:
        enabled: true
        level: 10
    customConfig:
      binderRepos:
        repos:
          - GitHub
targetCustomizations:
  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
    doNotDeploy: true
  - name: jupyter-stag
    clusterSelector:
      matchLabels:
        stage: staging
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: jupyter-jsc-dev2.fz-juelich.de
          baseUrl: /
          loggerName: JupyterDev2
        nfs:
          path: /nfs/hubs/rke2/staging/dev2
