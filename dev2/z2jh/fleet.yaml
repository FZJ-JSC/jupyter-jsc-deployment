defaultnamespace: dev2

labels:
  app: dev2
  component: z2jh

dependsOn:
  - selector:
      matchLabels:
        app: dev2
        component: secrets
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces

kustomize:
  dir: ./kustomize
helm:
  releaseName: dev2
  # repo: https://jupyterhub.github.io/helm-chart/
  # chart: jupyterhub
  # version: 3.1.0
  chart: https://github.com/jupyterhub/helm-chart/raw/gh-pages/jupyterhub-3.3.7.tgz
  values:
    ingress:
      # Set JupyterHub in maintenance:
      #   Set enabled here to false, update ingress in maintenance/fleet.yaml
      enabled: true
  valuesFiles:
    - ../../base-values/extraConfig.yaml
    # - ../../base-values/image.yaml
    - ../../base-values/image_devel.yaml
  valuesFrom:
    - configMapKeyRef:
        name: values
        namespace: dev2
        key: values.yaml

targetCustomizations:
  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
    doNotDeploy: true
