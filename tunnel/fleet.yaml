defaultNamespace: jupyter

labels:
  app: tunnel
  component: main

dependsOn:
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces
  - selector:
      matchLabels:
        app: postgres-operator
        component: databases
  - selector:
      matchLabels:
        app: tunnel
        component: secrets

helm:
  releaseName: tunnel
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-tunnel
  version: 3.1.6
  valuesFiles:
    - values/base/misc.yaml
targetCustomizations:
  - name: staging
    clusterSelector:
      matchLabels:
        stage: staging
    helm:
      valuesFiles:
        - values/overlays/staging/jupyterhubs.yaml
        - values/overlays/staging/misc.yaml
      values:
        replicas: 1
        servicessh:
          loadBalancerIP: "134.94.198.218"
  - name: production
    clusterSelector:
      matchLabels:
        stage: production
        prep: "false"
    helm:
      valuesFiles:
        - values/overlays/production/jupyterhubs.yaml
        - values/overlays/production/misc.yaml
      values:
        replicas: 1
        servicessh:
          loadBalancerIP: "134.94.198.229"
  - name: production
    clusterSelector:
      matchLabels:
        stage: production
        prep: "true"
    helm:
      valuesFiles:
        - values/overlays/production/jupyterhubs.yaml
        - values/overlays/production/misc.yaml
      values:
        replicas: 0
        servicessh:
          loadBalancerIP: "134.94.198.246"
diff:
  comparePatches:
  - apiVersion: apps/v1
    kind: StatefulSet
    labels:
      helm.sh/chart-name: jupyter-tunnel
    operations:
    - {"op":"remove", "path":"/spec/replicas"}
