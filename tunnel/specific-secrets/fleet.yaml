defaultnamespace: jupyter
labels:
  app: tunnel
  component: secrets

targetCustomizations:
- name: jupyter-stag
  clusterSelector:
    matchLabels:
      stage: staging
  kustomize:
    dir: overlays/staging
- name: jupyter-prod
  clusterSelector:
    matchLabels:
      stage: production
  kustomize:
    dir: overlays/production
