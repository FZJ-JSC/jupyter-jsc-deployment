sshtimeout: 3
nameOverride: "tunnel"
nodeSelector:
  worker: "true"
resources:
  requests:
    cpu: 100m
    memory: 4096Mi
  limits:
    cpu: 4000m
    memory: 4096Mi
gunicorn:
  processes: 4
  threads: 8
  maxRequests: 200
  maxRequestsJitter: 50
logging:
  stream:
    level: 10
  syslog:
    enabled: true
    level: 10
extraEnvVars:
  - name: SQL_USER
    valueFrom:
      secretKeyRef:
        name: jupyter.tunnel.postgresql.credentials.postgresql.acid.zalan.do
        key: username
  - name: SQL_PASSWORD
    valueFrom:
      secretKeyRef:
        name: jupyter.tunnel.postgresql.credentials.postgresql.acid.zalan.do
        key: password