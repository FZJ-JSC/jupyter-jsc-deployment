---
defaultNamespace: portalgauss

labels:
  app: portalgauss
  component: custom

dependsOn:
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces

helm:
  releaseName: portalgauss-custom
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-hub-customizations
  version: 0.24.10
  values:
    fullnameOverride: portalgauss-custom
    traefik:
      proxy: false
    global:
      name: portalgauss
      namespace: portalgauss
    dailyRestart:
      enabled: false
    jupyter-metrics:
      enabled: true
      nodeSelector:
        worker: "true"
    logging:
      syslog:
        enabled: true
        level: 10
    customConfig:
      services:
        JupyterLab:
          default:
            enabled: true
          "3.6":
            enabled: false
          "4.2":
            enabled: false
          "repo2docker":
            allowedLists:
              systems:
                - JSC-Cloud
                - LRZ-Staging
      systems:
        - JSC-Cloud
        - LRZ-Staging
        - LRZ
        - HLRS-Staging
      backendServices:
        outpostKubeLRZStaging:
          sendAccessToken: true
          urls:
            services: http://vm-138-246-238-21.cloud.mwn.de:8080/services
          requestKwargs:
            request_timeout: 180
        outpostKubeLRZ:
          sendAccessToken: true
          urls:
            services: http://vm-138-246-237-228.cloud.mwn.de:8080/services
          requestKwargs:
            request_timeout: 180
targetCustomizations:
  - name: jupyter-stag
    clusterSelector:
      matchLabels:
        stage: staging
    helm:
      values:
        customConfig:
          backendServices:
            outpostKubeHLRSStaging:
              requestKwargs:
                request_timeout: 180
          systems:
            - JSC-Cloud
            - LRZ-Staging
            - LRZ-Ganta-Staging
            - LRZ
            - HLRS-Staging
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: portal-staging.gauss-centre.eu
          baseUrl: /
          loggerName: PortalGaussStaging
        sidecarCheckInterval: 1200
        nfs:
          path: /nfs/hubs/rke2/staging/portalgauss
        livenessProbe:
          enabled: false
  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
        maintenance: "false"
    helm:
      values:
        customConfig:
          systems:
            - JSC-Cloud
            - LRZ
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: portal.gauss-centre.eu
          baseUrl: /
          loggerName: PortalGauss
        nfs:
          path: /nfs/hubs/rke2/production/portalgauss
  - name: jupyter-prod-maintenance
    clusterSelector:
      matchLabels:
        stage: production
        maintenance: "true"
    helm:
      values:
        ingress:
          certmanager: false
        customConfig:
          systems:
            - JSC-Cloud
            - LRZ
        global:
          hostname: zam12154.zam.kfa-juelich.de
          # hostname: portal.gauss-centre.eu
          baseUrl: /portalgauss/
          loggerName: PortalGauss
          tlssecretname: zam12154-tls
        nfs:
          path: /nfs/hubs/rke2/production/portalgauss
