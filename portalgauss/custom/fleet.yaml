defaultNamespace: portalgauss

labels:
  app: portalgauss
  component: custom

dependsOn:
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces

helm:
  releaseName: portalgauss-custom
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-hub-customizations
  version: 0.16.30
  values:
    fullnameOverride: portalgauss-custom
    global:
      name: portalgauss
      namespace: portalgauss
    dailyRestart:
      enabled: false
    ingress:
      enabled: true
    jupyter-metrics:
      enabled: true
      nodeSelector:
        worker: "true"
    logging:
      syslog:
        enabled: true
        level: 10
    customConfig:
      services:
        JupyterLab:
          default:
            enabled: true
          "3.6":
            enabled: false
          "4.2":
            enabled: false
      systems:
        - JSC-Cloud
        - LRZ-Staging
        - LRZ
        - HLRS-Staging
      backendServices:
        outpostKubeLRZStaging:
          urls:
            services: http://vm-138-246-238-21.cloud.mwn.de:8080/services
          requestKwargs:
            request_timeout: 180
        outpostKubeLRZ:
          urls:
            services: http://vm-138-246-237-228.cloud.mwn.de:8080/services
          requestKwargs:
            request_timeout: 180
targetCustomizations:
  - name: jupyter-stag
    clusterSelector:
      matchLabels:
        stage: staging
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: portal-staging.gauss-centre.eu
          baseUrl: /
          loggerName: PortalGaussStaging
        nfs:
          path: /nfs/hubs/rke2/staging/portalgauss
  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
    helm:
      values:
        customConfig:
          systems:
            - JSC-Cloud
            - LRZ
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: portal.gauss-centre.eu
          baseUrl: /
          loggerName: PortalGauss
        nfs:
          path: /nfs/hubs/rke2/production/portalgauss
        redirectEditInPlace: "false"
        redirects:
          - name: "production-docs"
            oldHost: "docs.portal.gauss-centre.eu"
            newHost: "jupyterjsc.pages.jsc.fz-juelich.de/docs/jupyterjsc/"
  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
        maintenance: "truedisabled"
    helm:
      values:
        ingress:
          certmanager: false
        customConfig:
          systems:
            - JSC-Cloud
            - LRZ
        global:
          hostname: zam12154.zam.kfa-juelich.de
          # hostname: portal.gauss-centre.eu
          baseUrl: /portalgauss/
          loggerName: PortalGauss
          tlssecretname: zam12154-tls
        nfs:
          path: /nfs/hubs/rke2/production/portalgauss
