defaultNamespace: outpost

labels:
  app: kubeoutpost
  component: main

dependsOn:
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces
  - selector:
      matchLabels:
        app: kubeoutpost
        component: secrets

kustomize:
  dir: ./kustomize
helm:
  releaseName: kube
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyterhub-outpost
  version: 1.0.5
  valuesFiles:
    - values/base/misc.yaml
    - values/base/config.yaml
targetCustomizations:
  - name: staging
    clusterSelector:
      matchLabels:
        stage: staging
    helm:
      values:
        extraEnvVars:
          - name: STAGE
            value: "staging"
          - name: SQL_USER
            valueFrom:
              secretKeyRef:
                name: outpost.kubeoutpost.postgresql.credentials.postgresql.acid.zalan.do
                key: username
          - name: SQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: outpost.kubeoutpost.postgresql.credentials.postgresql.acid.zalan.do
                key: password
  - name: production
    clusterSelector:
      matchLabels:
        stage: production
    helm:
      values:
        extraEnvVars:
          - name: STAGE
            value: "production"
          - name: SQL_USER
            valueFrom:
              secretKeyRef:
                name: outpost.kubeoutpost.postgresql.credentials.postgresql.acid.zalan.do
                key: username
          - name: SQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: outpost.kubeoutpost.postgresql.credentials.postgresql.acid.zalan.do
                key: password
