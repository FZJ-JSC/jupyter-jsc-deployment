apiVersion: v1
kind: ConfigMap
metadata:
  name: modules-4-2-juniq
  namespace: outpost
data:
  config.py: |
    c = get_config()
    c.ServerApp.root_dir = "/"
    c.ContentsManager.allow_hidden = True
    c.ServerApp.terminado_settings = {"shell_command": ["/bin/bash"]}
    c.ServerApp.default_url = "/lab/workspaces/_servername_/tree/home/jovyan"
    c.ServerApp.tornado_settings = {"websocket_max_message_size": 1024 * 1024 * 1024}
    c.ServerApp.max_buffer_size = 1024 * 1024 * 1024
    c.ServerApp.max_body_size = 1024 * 1024 * 1024
    c.ServerApp.quit_button = False
  load_jupyter_version.sh: |
    #!/bin/bash
    
    module purge
    module use ${OTHERSTAGES}
    module load Stages/2025
    module load GCC/13.3.0
    module load ParaStationMPI/5.10.0-1
    module load Jupyter-bundle/20250114

    module load Cartopy/0.24.1
    module load plotly.py/5.24.1
    module load matplotlib/3.9.2
    module load ParityOS/2.6.0
    module load qutip/5.0.4
    module load pulser/1.3.0
    module load PyQuil/4.16.2
    module load Cirq/1.5.0
    module load DWave/8.0.1
    module load CUDA/12
    module load Qiskit/1.2.4
    module load cuQuantum/24.11.0-CUDA-12
    module load cuQuantum-Python/24.11.0-CUDA-12
    module load cudaQ/0.9.0-CUDA-12
    module load PennyLane/0.39.0-CUDA-12
    module load qoqo-quest/0.16.1-CUDA-12
    module load myqlm/1.11.2
    module load pyunicore/.1.2.0
    module load jupyterlab-data-mount/1.0.0