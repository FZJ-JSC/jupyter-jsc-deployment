extraPythonPackages:
  - jupyterhub-kubespawner==7.0.0
extraVolumes:
  - configMap:
      defaultMode: 256
      name: gunicorn-config
    name: gunicorn-config
  - name: external-flavors
    configMap:
      name: outpost-kube-flavors-external
  - name: tz-config
    hostPath:
      path: /usr/share/zoneinfo/Europe/Berlin
      type: ""
extraVolumeMounts:
  - mountPath: /mnt/config
    name: gunicorn-config
  - name: external-flavors
    mountPath: /mnt/flavors
  - mountPath: /etc/localtime
    name: tz-config
outpostConfig: |-
  import asyncio
  import copy
  import hashlib
  import json
  import logging
  import os
  import requests
  import yaml

  from kubernetes import client
  from kubernetes import config
  from kubespawner import KubeSpawner

  lmod_options = ["xpra", "4.3", "4.2", "4.2-juniq", "3.6", "3.6-juniq"]

  ##########
  # Logging
  ##########
  class HealthCheckFilter(logging.Filter):
      def filter(self, record: logging.LogRecord) -> bool:
          return record.getMessage().find("/ping") == -1

  class EventsCheckFilter(logging.Filter):
      def filter(self, record: logging.LogRecord) -> bool:
          if record.funcName in ["_watch_and_update"]:
              return False
          return True

  # Remove health from application server logs
  logging.getLogger("uvicorn.access").addFilter(HealthCheckFilter())

  logger_name = os.environ.get("LOGGER_NAME", "JupyterHubOutpost")
  logging.getLogger(logger_name).addFilter(EventsCheckFilter())

  logged_logger_name = os.environ.get("LOGGER_NAME", "Outpost")
  c.JupyterHubOutpost.log_format = f"%(color)s[%(levelname)1.1s %(asctime)s.%(msecs).03d {logged_logger_name} %(name)s %(module)s:%(lineno)d]%(end_color)s %(message)s"

  ##########
  # Flavors
  ##########

  # Used to send update of the current usage to JHub during start/stop
  async def flavors_update_token(jupyterhub_name):
      token = os.environ.get(f"FLAVOR_{jupyterhub_name.upper()}_AUTH_TOKEN", "")
      if not token:
          raise Exception(f"Flavor auth token for {jupyterhub_name} not configured.")
      return token

  # Specific flavors for users, or disable it completely for specific users
  async def flavors_per_user(outpost, jupyterhub_name, authentication):
      hub_flavors = await outpost.get_flavors(jupyterhub_name)
      
      with open("/mnt/flavors/flavors.yaml", "r") as f:
          flavor_config = yaml.full_load(f)

      user_sets = []
      # check if the given user is part of any user set
      for key, value in flavor_config.get("users", {}).items():
          if jupyterhub_name in value.get("hubs", []):
              if authentication.get('name', 'unknown_user') in value.get("usernames", []):
                  user_sets.append((key, value.get("weight", 0)))
              else:
                  for user_group in authentication.get('groups', []):
                      if user_group in value.get("groups", []):
                          user_sets.append((key, value.get("weight", 0)))
                          break
      
      if len(user_sets) == 0:
          return hub_flavors

      user_sets = sorted(
          user_sets,
          key=lambda x: x[1]
      )
      # sorted sorts ascending, we're using weight, so we use the last element
      # with the biggest weight
      user_set = user_sets[-1][0]
      
      # When "disable" is true, we return an empty dict for this uset_set
      authentication_log = copy.deepcopy(authentication)
      if "access_token" in authentication_log.keys():
          del authentication_log["access_token"]
      if flavor_config.get("users", {}).get(user_set, {}).get("disable", False):
          outpost.log.debug(f"Specific user not allowed to use any flavors. Userset {user_set}. Used authentication dict: {authentication_log}")
          return {}

      outpost.log.debug(f"Use user specific flavor userset {user_set}. Used authentication dict: {authentication_log}")

      # Copy default flavors for this hub
      all_flavors = await outpost.get_flavors(None)
      user_flavors = {}
      
      for flavor in flavor_config.get("users", {}).get(user_set, {}).get("flavors", []):
          if flavor in all_flavors.keys():
              user_flavors[flavor] = all_flavors[flavor]
          else:
              outpost.log.warning(f"Unknown flavor for user set {user_set}: {flavor}")
      
      for flavorName, overrideDict in flavor_config.get("users", {}).get(user_set, {}).get("flavorsOverride", {}).items():
          if flavorName not in user_flavors.keys():
              outpost.log.warning(f"Do not override {flavorName} for user set {user_set}. Flavor not part of flavors list.")
              continue
          for overrideKey, overrideValue in overrideDict.items():
              user_flavors[flavorName][overrideKey] = overrideValue
      
      return user_flavors

  # Default flavors per JupyterHub
  async def flavors_per_hub(jupyterhub_name):
      with open("/mnt/flavors/flavors.yaml", "r") as f:
          flavor_config = yaml.full_load(f)
      
      # If no hub is defined, return all available flavors
      if not jupyterhub_name:
          return flavor_config.get("flavors", {})
      
      jupyterhub_sets = []
      # check if the given jupyterhub_name is part of any jhub set
      for key, value in flavor_config.get("hubs", {}).items():
          if jupyterhub_name in value.get("jupyterhubs", []):
              jupyterhub_sets.append((key, value.get("weight", 0)))
      
      # jupyterhub_name is not allowed to use any flavors 
      if len(jupyterhub_sets) == 0:
          return {}
      
      jupyterhub_sets = sorted(
          jupyterhub_sets,
          key=lambda x: x[1]
      )
      # sorted sorts ascending, we're using weight, so we use the last element
      # with the biggest weight
      jupyterhub_set = jupyterhub_sets[-1][0]
      
      hub_specific_flavors = {}
      for flavorName in flavor_config.get("hubs", {}).get(jupyterhub_set, {}).get("flavors", []):
          if flavorName in flavor_config.get("flavors", {}).keys():
              hub_specific_flavors[flavorName] = flavor_config["flavors"][flavorName]
      
      return hub_specific_flavors

  def get_flavor_resources(flavor):
      with open("/mnt/flavors/flavors.yaml", "r") as f:
          flavor_config = yaml.full_load(f)
      
      if flavor not in flavor_config.get("flavors", {}).keys():
          raise Exception(f"Flavor {flavor} not configured. Abort start.")
      
      return flavor_config["flavors"][flavor].get("resources", {})

  c.JupyterHubOutpost.flavors_update_token = flavors_update_token
  c.JupyterHubOutpost.flavors = flavors_per_hub
  c.JupyterHubOutpost.user_flavors = flavors_per_user
  c.JupyterHubOutpost.flavors_undefined_max = 0

  ##########
  # KubeSpawner
  ##########
  c.JupyterHubOutpost.spawner_class = KubeSpawner

  c.KubeSpawner.image_pull_policy = "Always"
  c.KubeSpawner.tolerations = [
      {"key": "usernode", "value": "true", "effect": "NoExecute"}
  ]
  # We set all the labels we want in extra_labels, so overwrite common_labels
  c.KubeSpawner.common_labels = {}

  c.KubeSpawner.secret_name_template = "tls-{userid}-{servername}"
  c.KubeSpawner.start_timeout = 600
  c.KubeSpawner.fs_gid = 100
  c.KubeSpawner.container_security_context = {
      "allowPrivilegeEscalation": True,
      "privileged": True,
      "capabilities": {
          "add": ["CAP_SYS_ADMIN"]
      }
  }

  c.KubeSpawner.extra_pod_config = {
      "restartPolicy": "Always",
  }
  c.KubeSpawner.delete_grace_period = 20
  c.KubeSpawner.lifecycle_hooks = {
      "preStop": {
          "exec": {
              "command": ["/bin/sh", "-c", "kill $(ps x | grep '[j]upyterhub-singleuser' | awk '{print $1}')"]
          }
      }
  }


  ##########
  # KubeSpawner prespawn hook
  ##########

  def get_image(spawner):    
      if spawner.user_options["option"] in lmod_options:
          lmod_image = "registry.jsc.fz-juelich.de/jupyterjsc/k8s/images/user-jupyterlab:lmod-4.0.18"
          return lmod_image
      
      if spawner.user_options["option"] == "repo2docker":
          return spawner.user_options["repo2docker"]["image"];

      if spawner.user_options["option"] == "default":
          return spawner.user_options.get("default", {}).get("image", "jupyter/minimal-notebook")

      return spawner.user_options.get("custom", {}).get("customimage", "No Image provided")    

  async def create_dockerregistry_secret(spawner):
      privaterepo = spawner.user_options.get("custom", {}).get("privaterepo", False)
      privaterepousername = spawner.user_options.get("custom", {}).get("privaterepousername", False)
      privaterepopassword = spawner.user_options.get("custom", {}).get("privaterepopassword", False)
      if privaterepo and privaterepousername and privaterepopassword:
          try:
              import base64
              auth_string = f"{privaterepousername}:{privaterepopassword}"
              auth_encoded = base64.b64encode(auth_string.encode()).decode()
              dockerregistry_plain_dict = {
                  "auths": {
                      privaterepo: {
                          "auth": auth_encoded
                      }
                  }
              }
              
              docker_config_json = json.dumps(dockerregistry_plain_dict)
              docker_config_base64 = base64.b64encode(docker_config_json.encode()).decode()
              
              config.load_incluster_config()
              v1 = client.CoreV1Api()
              image_pull_secret_name = f"{spawner.pod_name}-reg"
              secret_manifest = {
                  "apiVersion": "v1",
                  "kind": "Secret",
                  "type": "kubernetes.io/dockerconfigjson",
                  "metadata": {
                      "name": image_pull_secret_name,
                      "resourceversion": "v1",
                      "labels": {
                          "pod": spawner.pod_name
                      }
                  },
                  "data": {
                      ".dockerconfigjson": docker_config_base64
                  },
              }
              try:
                  v1.read_namespaced_secret(name=image_pull_secret_name, namespace=spawner.namespace)
              except:
                  pass
              else:
                  spawner.log.info(f"{spawner._log_name} - Delete pre existing registry secret {image_pull_secret_name}")
                  v1.delete_namespaced_secret(name=image_pull_secret_name, namespace=spawner.namespace)
              v1.create_namespaced_secret(body=secret_manifest, namespace=spawner.namespace)
              image_pull_secrets = getattr(spawner, "image_pull_secrets", [])
              if not image_pull_secrets:
                  image_pull_secrets = [image_pull_secret_name]
              elif type(image_pull_secrets) == list:
                  image_pull_secrets.append(image_pull_secret_name)
              elif type(image_pull_secrets) == str:
                  image_pull_secrets = [image_pull_secrets] + [image_pull_secret_name]
              else:
                  image_pull_secrets = [image_pull_secret_name]
              spawner.image_pull_secrets = image_pull_secrets
          except:
              spawner.log.exception(f"{spawner._log_name} - Could not create dockerregistry secret")

  def delete_previous_events(spawner):
      config.load_incluster_config()
      v1 = client.CoreV1Api()
      events = v1.list_namespaced_event(namespace=spawner.namespace, field_selector=f"involvedObject.name={spawner.pod_name}")
      for event in events.items:
          name = event.metadata.name
          if name:
              v1.delete_namespaced_event(name=name, namespace=spawner.namespace)

  async def pre_spawn_hook(spawner):
      # Create registry secret, needed
      await create_dockerregistry_secret(spawner)
      
      # This will avoid the spamming of old events to a new spawn event
      # Requires JupyterHub Outpost Helm Chart 1.0.7 or newer
      delete_previous_events(spawner)
          
      # if we're using the repo2docker profile, we have to trigger the build + wait until it's finished
      if spawner.user_options["option"] == "repo2docker":
          notebook = spawner.user_options.get("repo2docker", {}).get("repopath", "")
          notebook_type = spawner.user_options.get("repo2docker", {}).get("repopathtype", "file")
          if notebook_type == "file" and notebook:
              spawner.default_url = f"/lab/tree/{notebook}"
          elif notebook_type == "url" and notebook:
              spawner.default_url = notebook
      if spawner.user_options["option"] in ["repo2docker", "custom"]:
          spawner.cmd = ["/bin/sh", "-c"]
          spawner.args = [
              '''
              #!/bin/sh
              # Get the current jupyterhub-singleuser version
              version=$(jupyterhub-singleuser --version || echo "0.0.0")

              # Set the desired version range
              min_version="4.0.0"
              max_version="5.0.0"
              target_version="4.1.6"

              # Function to check if the version is in range
              in_range() {
                  [ "$(printf '%s\n' "$min_version" "$1" | sort -V | head -n1)" = "$min_version" ] && \
                  [ "$(printf '%s\n' "$1" "$max_version" | sort -V | head -n1)" = "$1" ]
              }

              # Check if the current version is within the range
              if ! in_range "$version"; then
                  echo "Installing jupyterhub-singleuser $target_version as version $version is not within $min_version - $max_version."
                  pip install "jupyterhub==$target_version"
              else
                  echo "jupyterhub-singleuser $version is within the required version range."
              fi

              # Start the jupyterhub-singleuser
              exec jupyterhub-singleuser
              '''
          ]

  c.KubeSpawner.extra_pod_config = {
      "restartPolicy": "Never"
  }

  c.KubeSpawner.pre_spawn_hook = pre_spawn_hook

  ##########
  # KubeSpawner post_stop_hook
  ##########

  def post_stop_hook(spawner):
      config.load_incluster_config()
      v1 = client.CoreV1Api()
      image_pull_secret_name = f"{spawner.pod_name}-reg"
      try:
          v1.read_namespaced_secret(name=image_pull_secret_name, namespace=spawner.namespace)
      except:
          pass
      else:
          spawner.log.info(f"{spawner._log_name} - Delete registry secret {image_pull_secret_name}")
          v1.delete_namespaced_secret(name=image_pull_secret_name, namespace=spawner.namespace)

  c.KubeSpawner.post_stop_hook = post_stop_hook

  ##########
  # KubeSpawner profiles
  ##########


  async def contact_storage_manager(spawner, localstoragepath):
      # Ensure the user does have a userhome
      token = os.environ.get("STORAGE_MANAGER_TOKEN", None)
      storage_url = os.environ.get("STORAGE_MANAGER_URL", None)
      if storage_url and token:
          hub = spawner.extra_labels.get("app", "jupyter")
          stage = os.environ.get("STAGE", "staging")
          userid = str(spawner.user.id)
          soft = "25g"
          hard = "30g"
          request_header = {
              "Content-Type": "application/json",
              "Accept": "application/json",
          }
          body = {
            "stage": stage,
            "service": hub,
            "user_id": userid,
            "softlimit": soft,
            "hardlimit": hard
          }
          try:
              r = requests.post(f"{storage_url}?token={token}", headers=request_header, json=body, timeout=3)
              r.raise_for_status()
              storage_info = r.json()
              used = storage_info.get("human", {}).get("used", "0G")
              summary = ""
              details = ""
              red = False
              orange = False
              if int(storage_info.get("bytes", {}).get("used", "0")) >= int(storage_info.get("bytes", {}).get("hard")):
                  red = True
                  summary = f"Hard limit of disk quota exceeded ({used} / {soft}). Your container might not start for this reason. Please contact support (see button in footer) to solve this."
                  details = f"You're allowed to use up to {soft} disk space. Please keep your disk usage below this threshold."
              elif int(storage_info.get("bytes", {}).get("used", "0")) > int(storage_info.get("bytes", {}).get("soft")):
                  summary = f"Soft limit of disk quota exceeded ({used} / {soft}). Please remove some files to stay below {soft}. Your container might not start for this reason. Please contact support (see button in footer) to solve this."
                  details = f"It's possible to use up to {hard} for maximum 7 days. Afterwards, file creation in your directory is impossible, which may prevent a service start."
                  orange = True
              else:
                  summary = f"Disk quota status: {used} / {soft}"
                  details = f"It's possible to use up to {hard} for maximum 7 days. Afterwards, file creation in your directory is impossible, which may prevent a service start."

              if red:
                  msg = f"<details><summary><span style=\"color:red;\">{summary}</span></summary>{details}</details>"
              elif orange:
                  msg = f"<details><summary><span style=\"color:darkorange;\">{summary}</span></summary>{details}</details>"
              else:
                  msg = f"<details><summary>{summary}</summary>{details}</details>"
              event = {
                  "progress": "10",
                  "html_message": msg,
                  "failed": False
              }
              await spawner._outpostspawner_send_event(event)
              return {
                  "volume_mounts": [{
                      "name": "nfs-userdata",
                      "mountPath": localstoragepath,
                      "readOnly": False 
                  }],
                  "volumes": [{
                      "name": "nfs-userdata", 
                      "hostPath": {
                          # userid gets expanded by KubeSpawner, do not use mapped 
                          # hub name here, each hub uses it's own home dir.
                          "path": f"/p/home/jusers/{stage}/{spawner.jupyterhub_name}/{{userid}}",
                          "type": ""
                      }
                  }]
              }
          except:
              spawner.log.exception(f"{spawner._log_name} - Could not get storage information")
              return False
      else:
          spawner.log.warning(f"{spawner._log_name} - Storage Manager env variables not set")
          return False

  async def get_option_storage(spawner, service, option):
      ret = {
          "volumes": [],
          "volume_mounts": []
      }
      option_dash = option.replace(".", "-")
      
      # specsp11 is a specific case
      if service == "jupyterlab" and option == "repo2docker" and spawner.user_options.get("repo2docker", {}).get("repourl", "").endswith("Simulation-Benchmarks/11thSPE-CSP"):
          ret["volumes"].append(
              {
                  "name": "nfs-specsp",
                  "nfs": {
                      "server": "10.0.2.191",
                      "path": "/mnt/specsp11",
                      "readOnly": True
                  }                
              }
          )
          ret["volume_mounts"].append(
            {
                "name": "nfs-specsp",
                "mountPath": "/home/jovyan/shared_folder",
                "readOnly": True
            }
          )
      
      if service == "jupyterlab" and option in lmod_options:
          # These lmod options need the lua / lmod software stack.
          ret["volumes"].extend([
              {
                  "name": "nfs-software", 
                  "hostPath": {
                      "path": "/p/software/jsccloud", 
                      "type": ""
                  }
              },
              {
                  "name": "uftp", 
                  "configMap": {
                      "defaultMode": 292,
                      "name": "uftp"
                  }
              },
              {
                  "name": f"modules-{option_dash}", 
                  "configMap": {
                      "defaultMode": 292,
                      "name": f"modules-{option_dash}"
                  }
              },
              {
                  "name": f"modules-user-{option_dash}", 
                  "configMap": {
                      "defaultMode": 292,
                      "name": f"modules-user-{option_dash}"
                  }
              }
          ])
          ret["volume_mounts"].extend([
              {              
                  "name": "nfs-software", 
                  "mountPath": "/p/software/jsccloud", 
                  "readOnly": True
              },
              {
                  "name": "uftp", 
                  "mountPath": "/tmp/custom/uftp.py",
                  "subPath": "uftp.py"
              },
              {
                  "name": f"modules-{option_dash}", 
                  "mountPath": "/tmp/custom/load_jupyter_version.sh", 
                  "subPath": "load_jupyter_version.sh"
              },
              {
                  "name": f"modules-{option_dash}", 
                  "mountPath": "/tmp/custom/config.py", 
                  "subPath": "config.py"
              },
              {
                  "name": f"modules-user-{option_dash}", 
                  "mountPath": "/tmp/custom/load_jupyter_modules.sh",
                  "subPath": "load_jupyter_modules.sh"
              }
          ])

      return ret

  async def get_storage(spawner):
      # Define the volumes and volume mounts
      ret = {
          "volume_mounts": [],
          "volumes": []
      }
      
      # First we add the local persistent storage for the user
      if spawner.user_options["service"] == "jupyterlab" and spawner.user_options["option"] in lmod_options:
          # For these "preconfigured" JupyterLabs, we always have to set the localstoragepath to the userhome
          if "storage" not in spawner.user_options:
              spawner.user_options["storage"] = {}
          spawner.user_options["storage"]["localstoragepath"] = "/home/jovyan"
      
      if "localstoragepath" in spawner.user_options.get("storage", {}).keys():
          # Attach the local JSC-Cloud NFS-Server storage to the server
          local_storage = await contact_storage_manager(spawner, spawner.user_options["storage"]["localstoragepath"])
          if local_storage:
              ret["volume_mounts"].extend(local_storage["volume_mounts"])
              ret["volumes"].extend(local_storage["volumes"])
      
      # Then we add configmaps, which might be required by the defined option
      option_storage = await get_option_storage(spawner, spawner.user_options["service"], spawner.user_options["option"])    
      ret["volume_mounts"].extend(option_storage["volume_mounts"])
      ret["volumes"].extend(option_storage["volumes"])
      
      return ret
      

  def get_node_selector(spawner, jupyterhub_name, resources, flavor):
      # We'tr trying to fill the nodes from oldest to newest, instead of relying on the KubeScheduler.
      # This way, it's easier to remove node when more and more users left the system.
      
      config.load_incluster_config()
      core = client.CoreV1Api()
      flavor_mem_request = resources.get("mem_guarantee", "0M")
      spawner.log.info(f"{spawner._log_name} - NodeSelector: {flavor_mem_request}M memory for {flavor} ({jupyterhub_name}) requested")
      
      # get all usernodes, sort them by creation date
      try:
          all_nodes = core.list_node().to_dict()
      except:
          spawner.log.info(f"{spawner._log_name} - NodeSelector: Could not load node infos")
          return {"usernode": "true"}
      usernodes = [x for x in all_nodes.get("items", []) if x.get("metadata", {}).get("labels", {}).get("usernode", "false") == "true"]
      usernodes_sorted = sorted(usernodes, key=lambda d: d["metadata"]['creation_timestamp'])

      for usernode in usernodes_sorted:
          node_name = usernode.get("metadata", {}).get("name", "")
          try:
              requested_bytes = int(json.loads(usernode.get("metadata", {}).get("annotations", {}).get("management.cattle.io/pod-requests", '{}')).get("memory", "0"))
              to_add_bytes = int(flavor_mem_request.replace("M", "")) * 1024 * 1024
              total_bytes = int(usernode.get("status", {}).get("allocatable", {}).get("memory", "0Ki").replace("Ki", ""))*1024 # 8128016
              if node_name and requested_bytes + to_add_bytes < total_bytes:
                  spawner.log.info(f"{spawner._log_name} - NodeSelector: Use {node_name}")
                  return {"kubernetes.io/hostname": node_name}
              else:
                  spawner.log.info(f"{spawner._log_name} - NodeSelector: Do not use {node_name}")
          except:
              spawner.log.info(f"{spawner._log_name} - NodeSelector: Could not load node {node_name}")
              continue
      spawner.log.warning(f"{spawner._log_name} - NodeSelector: Use kubernetes scheduler to place node")
      return {"usernode": "true"}


  async def profile_list(spawner):
      # We're loading this config file for each Spawner object
      # Therefore, it's fine to just create the profile for this specific option    
      jupyterhub_name = spawner.jupyterhub_name
      service = spawner.user_options["service"]
      option = spawner.user_options["option"].replace(".", "-")
      flavor = spawner.user_options["flavor"]
      
      # KubeSpawner relies on spawner.user_options.profile
      spawner.user_options["profile"] = option
      
      resources = get_flavor_resources(flavor)

      node_selector = get_node_selector(spawner, jupyterhub_name, resources, flavor)
      image = get_image(spawner)

      kubespawner_override = {
          "cpu_guarantee": resources["cpu_guarantee"],
          "cpu_limit": resources["cpu_limit"],
          "mem_guarantee": resources["mem_guarantee"],
          "mem_limit": resources["mem_limit"],
          "node_selector": node_selector,
          "image": image,
          "slug": option
      }
      
      storage = await get_storage(spawner)
      if storage:
          kubespawner_override.update(storage)
      return [
        {
          "display_name": f"{service}/{option}",
          "slug": option,
          "kubespawner_override": kubespawner_override
        }
      ]

      

  c.KubeSpawner.profile_list = profile_list
