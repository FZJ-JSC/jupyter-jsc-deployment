  """.replace("{jupyter_config_path_b64}", jupyter_config_path_b64)

  def default_image_start_script(spawner):
      datamount_version = f"=={spawner.data_mount_extension_version}" if spawner.data_mount_extension_version else ""
      jupyter_config_path_b64 = base64.b64decode("ZXhwb3J0IEpVUFlURVJfQ09ORklHX1BBVEg9IiR7SlVQWVRFUl9DT05GSUdfUEFUSDorJEpVUFlURVJfQ09ORklHX1BBVEg6fS9tbnQvZGF0YW1vdW50X3N0YXJ0Igo=").decode()
      return """#!/bin/sh
  {jupyter_config_path_b64}
  if command -v pip >/dev/null 2>&1; then
      if [ -n "$VIRTUAL_ENV" ]; then
          pip install jupyterlab-data-mount{datamount_version} jupyter-collaboration jupyterlab-hub-credit-extension
      else
          pip install --user jupyterlab-data-mount{datamount_version} jupyter-collaboration jupyterlab-hub-credit-extension
      fi
  fi
  command -v start-singleuser.sh >/dev/null 2>&1 && exec start-singleuser.sh || exec jupyterhub-singleuser
  """.replace("{datamount_version}", datamount_version).replace("{jupyter_config_path_b64}", jupyter_config_path_b64)

  def custom_image_start_script(spawner):
      datamount_version = f"=={spawner.data_mount_extension_version}" if spawner.data_mount_extension_version else ""

      # export JUPYTER_CONFIG_PATH="..JUPYTER_CONFIG_PATH....JUPYTER_CONFIG_PATH:.../mnt/datamount_start" in b64, so helm can handle it
      jupyter_config_path_b64 = base64.b64decode("ZXhwb3J0IEpVUFlURVJfQ09ORklHX1BBVEg9IiR7SlVQWVRFUl9DT05GSUdfUEFUSDorJEpVUFlURVJfQ09ORklHX1BBVEg6fS9tbnQvZGF0YW1vdW50X3N0YXJ0Igo=").decode()
      return """#!/bin/sh

  # 1. Check if user is root
  if [ "$(id -u)" -eq 0 ]; then
      echo "[INFO] Running as root."

      # 2. Check if pip exists, if not: install Python + pip
      if ! command -v pip >/dev/null 2>&1; then
          echo "[INFO] pip not found. Installing Python and pip..."

          if command -v apk >/dev/null 2>&1; then
              apk add --no-cache python3 py3-pip shadow gcc python3-dev musl-dev linux-headers bash
          elif command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y python3 python3-pip adduser python3-venv bash passwd
          elif command -v dnf >/dev/null 2>&1; then
              dnf install -y python3 python3-pip shadow-utils util-linux bash
          else
              echo "[ERROR] Unsupported package manager. Install Python manually."
              exit 1
          fi
      fi

      env | grep -vE '^(PWD|HOME|SHLVL|OLDPWD|_)=|SCOPE' > /tmp/jovyan.env
      printf "$JUPYTERHUB_OAUTH_SCOPES" > /tmp/jovyan_JUPYTERHUB_OAUTH_SCOPES.env
      printf "$JUPYTERHUB_OAUTH_ACCESS_SCOPES" > /tmp/jovyan_JUPYTERHUB_OAUTH_ACCESS_SCOPES.env
      printf "$JUPYTERHUB_OAUTH_CLIENT_ALLOWED_SCOPES" > /tmp/jovyan_JUPYTERHUB_OAUTH_CLIENT_ALLOWED_SCOPES.env
      SCRIPT="$(realpath "$0")"

      # 4. Create jovyan user if missing
      if ! id jovyan >/dev/null 2>&1; then
          echo "[INFO] Creating user jovyan..."
          useradd -m jovyan 2>/dev/null || adduser -D jovyan
          if [ -d /etc/skel ]; then
              cp -a /etc/skel/. /home/jovyan/
          fi
          chown -R jovyan:jovyan /home/jovyan
          python3 -m venv /tmp/jupyterhub_venv

          chown -R jovyan:jovyan /tmp/jupyterhub_venv
      fi
      exec su - jovyan -c "$SCRIPT"

  fi

  echo "[INFO] Running as user $(whoami)"

  if [ -f /tmp/jovyan.env ]; then
      set -a
      . /tmp/jovyan.env
      set +a
      export JUPYTERHUB_OAUTH_SCOPES="$(cat /tmp/jovyan_JUPYTERHUB_OAUTH_SCOPES.env)"
      export JUPYTERHUB_OAUTH_ACCESS_SCOPES="$(cat /tmp/jovyan_JUPYTERHUB_OAUTH_ACCESS_SCOPES.env)"
      export JUPYTERHUB_OAUTH_CLIENT_ALLOWED_SCOPES="$(cat /tmp/jovyan_JUPYTERHUB_OAUTH_CLIENT_ALLOWED_SCOPES.env)"
  fi

  if [ -f /tmp/jupyterhub_venv/bin/activate ]; then
      . /tmp/jupyterhub_venv/bin/activate
  fi

  # 7. Ensure jupyterhub-singleuser in desired version range
  if command -v pip >/dev/null 2>&1; then
      if ! command -v jupyterhub-singleuser >/dev/null 2>&1; then
          echo "[INFO] Installing jupyterhub-singleuser (current: $version)"
          if [ -n "$VIRTUAL_ENV" ]; then
              pip install jupyterhub jupyterlab jupyterlab-hub-credit-extension
          else
              pip install --user jupyterhub jupyterlab jupyterlab-hub-credit-extension
          fi
      fi

      # 8. Install jupyterlab-data-mount
      echo "[INFO] Installing jupyterlab-data-mount..."
      if [ -n "$VIRTUAL_ENV" ]; then
          pip install jupyterlab-data-mount{datamount_version} jupyter-collaboration jupyterlab-hub-credit-extension
      else
          pip install --user jupyterlab-data-mount{datamount_version} jupyter-collaboration jupyterlab-hub-credit-extension
      fi
  fi

  # 9. Set config path
  {jupyter_config_path_b64}

  # 10. Launch
  echo $JUPYTER_CONFIG_PATH
  if command -v start-singleuser.sh >/dev/null 2>&1; then
      exec start-singleuser.sh
  else
      exec jupyterhub-singleuser
  fi
  """.replace("{datamount_version}", datamount_version).replace("{jupyter_config_path_b64}", jupyter_config_path_b64)

  async def profile_list(spawner):
      # We're loading this config file for each Spawner object
      # Therefore, it's fine to just create the profile for this specific option
      jupyterhub_name = spawner.jupyterhub_name
      service = spawner.user_options["service"]
      option = spawner.user_options["option"].replace(".", "-")
      flavor = spawner.user_options["flavor"]

      # KubeSpawner relies on spawner.user_options.profile
      spawner.user_options["profile"] = option

      resources = get_flavor_resources(flavor)

      node_selector = get_node_selector(spawner, jupyterhub_name, resources, flavor)
      image = get_image(spawner)
      data_mount_config = None
      init_mounts = []
      if data_mount_enabled:
          data_mount_config = get_data_mount_config(spawner, spawner.user_options)
          init_mounts = get_init_mounts(spawner, spawner.user_options)

      kubespawner_override = {
          "cpu_guarantee": resources["cpu_guarantee"],
          "cpu_limit": resources["cpu_limit"],
          "mem_guarantee": resources["mem_guarantee"],
          "mem_limit": resources["mem_limit"],
          "node_selector": node_selector,
          "image": image,
          "slug": option,
          "data_mount_start": default_image_start_script,
          "data_mount_enabled": data_mount_enabled,
          "data_mount_config": data_mount_config,
          "init_mounts": init_mounts
      }

      gpu = False
      if "gpu_guarantee" in resources.keys():
          kubespawner_override["extra_resource_guarantees"] = {"nvidia.com/gpu": f"{resources['gpu_guarantee']}"}
          gpu = True
      if "gpu_limit" in resources.keys():
          kubespawner_override["extra_resource_limits"] = {"nvidia.com/gpu": f"{resources['gpu_limit']}"}
          gpu = True
      if gpu:
          kubespawner_override["extra_pod_config"] = {
              "restartPolicy": "Never",
              "runtimeClassName": "nvidia"
          }
          kubespawner_override["node_selector"] = {"usernode-gpu": "true"}

      if spawner.user_options["service"] == "jupyterlab" and spawner.user_options["option"] == "custom":
          kubespawner_override["data_mount_start"] = custom_image_start_script
      elif spawner.user_options["service"] == "jupyterlab" and spawner.user_options["option"] in lmod_options:
          kubespawner_override["data_mount_start"] = lmod_image_start_script

      storage = await get_storage(spawner)
      if storage:
          kubespawner_override.update(storage)
      return [
        {
          "display_name": f"{service}/{option}",
          "slug": option,
          "kubespawner_override": kubespawner_override
        }
      ]

  c.KubeSpawner.profile_list = profile_list
