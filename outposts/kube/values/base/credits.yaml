---
credits:
  credits:
    public:
      cap: 70
      grant_value: 70
      grant_interval: 86400
    default:
      cap: 130
      grant_value: 130
      grant_interval: 86400
    priority:
      cap: 250
      grant_value: 250
      grant_interval: 86400
  users:
    gmailusers:
      hubs:
        - jupyterjsc
        - portalgauss
        - juniq
        - coec
        - coeraise
        - ebrains
        - euroccgcs
        - dev1
        - dev2
        - nfdigeneral
      authentication:
        username: ".*g(oogle)?mail.com$"
      weight: 9999
      credits:
        - public
    public:
      negate_authentication: true
      hubs:
        - jupyterjsc
        - portalgauss
        - juniq
      authentication:
        groups: ["urn:geant:helmholtz.de:Helmholtz-member"]
      weight: 90
      credits:
        - public
    defaultusers:
      hubs:
        - jupyterjsc
        - portalgauss
        - juniq
        - nfdigeneral
      authentication:
        groups: ["urn:geant:helmholtz.de:Helmholtz-member"]
      weight: 90
      credits:
        - default
    priorityusers:
      hubs:
        - jupyterjsc
        - portalgauss
        - juniq
        - nfdigeneral
      authentication:
        username: "*fz-juelich.de"
      weight: 95
      credits:
        - priority
    free:
      hubs:
        - coec
        - coeraise
        - ebrains
        - euroccgcs
        - dev1
        - dev2
        - nfdigeneral
      authentication:
        username: ".*"
      weight: 94
      credits:
        - default
