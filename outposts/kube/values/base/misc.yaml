cryptSecret: outpost-cryptkey
outpostUsers: outpost-users
extraEnvVarsSecrets:
  - outpost-generics
extraEnvVars:
  - name: SQL_USER
    valueFrom:
      secretKeyRef:
        name: outpost.kubeoutpost.postgresql.credentials.postgresql.acid.zalan.do
        key: username
  - name: SQL_PASSWORD
    valueFrom:
      secretKeyRef:
        name: outpost.kubeoutpost.postgresql.credentials.postgresql.acid.zalan.do
        key: password
nameOverride: "outpost-kube"
fullnameOverride: "outpost-kube"
logging:
  syslog:
    enabled: true
    level: 10
  stream:
    enabled: true
    level: 20
extraVolumes:
  - name: external-flavors
    configMap:
      name: outpost-kube-flavors-external
  - name: tz-config
    hostPath:
      path: /usr/share/zoneinfo/Europe/Berlin
      type: ""
extraVolumeMounts:
  - name: external-flavors
    mountPath: /mnt/flavors
  - mountPath: /etc/localtime
    name: tz-config
nodeSelector:
  worker: "true"
serviceAccount:
  nodesClusterRole: true
