  - mountPath: /mnt/jobs/jupyterlab_vscode
    name: job-descriptions-vscode
  - mountPath: /mnt/jobs/jupyterlab_xpra
    name: job-descriptions-xpra
  - mountPath: /mnt/jobs/jupyterlab_4.3
    name: job-descriptions-4-3
  - mountPath: /mnt/jobs/jupyterlab_4.2
    name: job-descriptions-4-2
  - mountPath: /mnt/jobs/jupyterlab_4.2-juniq
    name: job-descriptions-4-2-juniq
  - mountPath: /mnt/jobs/jupyterlab_4.3-juniq
