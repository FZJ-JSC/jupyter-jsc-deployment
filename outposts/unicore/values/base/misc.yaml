cryptSecret: outpost-cryptkey
outpostUsers: outpost-users
extraEnvVarsSecrets:
  - outpost-generics
extraEnvVars:
  - name: SQL_USER
    valueFrom:
      secretKeyRef:
        name: unicore.unicoreoutpost.postgresql.credentials.postgresql.acid.zalan.do
        key: username
  - name: SQL_PASSWORD
    valueFrom:
      secretKeyRef:
        name: unicore.unicoreoutpost.postgresql.credentials.postgresql.acid.zalan.do
        key: password
extraVolumes:
  - name: tz-config
    hostPath:
      path: /usr/share/zoneinfo/Europe/Berlin
      type: ""
extraVolumeMounts:
  - mountPath: /etc/localtime
    name: tz-config
nameOverride: "outpost-unicore"
fullnameOverride: "outpost-unicore"
logging:
  stream:
    level: 20
  syslog:
    enabled: true
    level: 10
nodeSelector:
  worker: "true"
securityContext:
  capabilities:
    add:
    - SYS_PTRACE
