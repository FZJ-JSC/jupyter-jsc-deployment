cryptSecret: outpost-cryptkey
outpostUsers: outpost-users
extraEnvVarsSecrets:
  - outpost-generics
extraEnvVars:
  - name: SQL_USER
    valueFrom:
      secretKeyRef:
        name: unicore.unicoreoutpost.postgresql.credentials.postgresql.acid.zalan.do
        key: username
  - name: SQL_PASSWORD
    valueFrom:
      secretKeyRef:
        name: unicore.unicoreoutpost.postgresql.credentials.postgresql.acid.zalan.do
        key: password
  - name: GUNICORN_CONFIG_FILE
    value: "/mnt/config/gunicorn_http.py"
nameOverride: "outpost-unicore"
fullnameOverride: "outpost-unicore"
logging:
  stream:
    level: 20
  syslog:
    enabled: true
    level: 10
nodeSelector:
  worker: "true"
