defaultNamespace: unicore
kustomize:
  dir: ./kustomize
helm:
  releaseName: unicore
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyterhub-outpost
  version: 1.0.4
  valuesFiles:
    - values/base/misc.yaml
    - values/base/config.yaml
targetCustomizations:
  - name: staging
    clusterSelector:
      matchLabels:
        name: jupyter-stag
    helm:
      values:
        extraEnvVars:
          - name: STAGE
            value: "staging"
          - name: SQL_USER
            valueFrom:
              secretKeyRef:
                name: unicore.unicoreoutpost.postgresql.credentials.postgresql.acid.zalan.do
                key: username
          - name: SQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: unicore.unicoreoutpost.postgresql.credentials.postgresql.acid.zalan.do
                key: password
  - name: production
    clusterSelector:
      matchLabels:
        stage: production
    helm:
      values:
        extraEnvVars:
          - name: STAGE
            value: "production"
          - name: SQL_USER
            valueFrom:
              secretKeyRef:
                name: unicore.unicoreoutpost.postgresql.credentials.postgresql.acid.zalan.do
                key: username
          - name: SQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: unicore.unicoreoutpost.postgresql.credentials.postgresql.acid.zalan.do
                key: password

dependsOn:
  - selector:
      matchLabels:
        create-namespaces: "true"