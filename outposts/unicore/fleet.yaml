defaultNamespace: unicore

labels:
  app: unicoreoutpost
  component: main

dependsOn:
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces
  - selector:
      matchLabels:
        app: unicoreoutpost
        component: secrets


kustomize:
  dir: ./kustomize
helm:
  releaseName: unicore
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyterhub-outpost
  version: 2.0.0
  values:
    image:
      tag: 2.0.1
  valuesFiles:
    - values/base/misc.yaml
    - values/base/config.yaml
targetCustomizations:
  - name: staging
    clusterSelector:
      matchLabels:
        name: jupyter-stag
    helm:
      values:
        # image:
        #   tag: devel
        extraEnvVars:
          - name: STAGE
            value: "staging"
          - name: SQL_USER
            valueFrom:
              secretKeyRef:
                name: unicore.unicoreoutpost.postgresql.credentials.postgresql.acid.zalan.do
                key: username
          - name: SQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: unicore.unicoreoutpost.postgresql.credentials.postgresql.acid.zalan.do
                key: password
          - name: GUNICORN_CONFIG_FILE
            value: "/mnt/config/gunicorn_http.py"
  - name: production
    clusterSelector:
      matchLabels:
        stage: production
    helm:
      values:
        extraEnvVars:
          - name: STAGE
            value: "production"
          - name: SQL_USER
            valueFrom:
              secretKeyRef:
                name: unicore.unicoreoutpost.postgresql.credentials.postgresql.acid.zalan.do
                key: username
          - name: SQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: unicore.unicoreoutpost.postgresql.credentials.postgresql.acid.zalan.do
                key: password
          - name: GUNICORN_CONFIG_FILE
            value: "/mnt/config/gunicorn_http.py"
    kustomize:
      dir: ./kustomize
