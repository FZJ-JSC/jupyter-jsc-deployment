defaultnamespace: unicore

labels:
  app: unicoreoutpost
  component: secrets

targetCustomizations:
- name: jupyter-stag
  clusterSelector:
    matchLabels:
      stage: staging
  kustomize:
    dir: overlays/staging
- name: jupyter-prod
  clusterSelector:
    matchLabels:
      stage: production
      prep: "false"
  kustomize:
    dir: overlays/production
- name: jupyter-prod
  clusterSelector:
    matchLabels:
      stage: production
      prep: "true"
  kustomize:
    dir: overlays/production-prep
