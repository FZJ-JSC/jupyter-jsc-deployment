---
defaultNamespace: jupyterjsc

labels:
  app: jupyterjsc
  component: custom

dependsOn:
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces

helm:
  releaseName: jupyterjsc-custom
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-hub-customizations
  version: 0.24.14
  values:
    dailyRestart:
      enabled: false
    fullnameOverride: jupyterjsc-custom
    global:
      name: jupyterjsc
      namespace: jupyterjsc
    customConfig:
      services:
        JupyterLab:
          defaultOption: "4.3"
          "4.3":
            allowedLists:
              systems:
                - JURECA
                - JUWELS
                - JUPITER
                - JUSUF
                - JSC-Cloud
          vscode:
            enabled: true
            allowedLists:
              groups:
                - "geant:dfn.de:fz-juelich.de:jsc:jupyter:beta_tester"
    jupyter-metrics:
      enabled: true
      nodeSelector:
        worker: "true"
      secretSuffixes:
        - metrics
        - metrics-codebase
    jupyter-user-kpi:
      enabled: true
      nodeSelector:
        worker: "true"
      secretSuffixes:
        - user-kpi-codebase
    logging:
      stream:
        level: 10
      syslog:
        enabled: true
        level: 10
targetCustomizations:
  - name: jupyter-stag
    clusterSelector:
      matchLabels:
        stage: staging
    helm:
      values:
        global:
          # hostname: zam12246.jsc.fz-juelich.de
          hostname: jupyter-staging.jsc.fz-juelich.de
          baseUrl: /
          loggerName: JupyterJSCStaging
        sidecarCheckInterval: 1200
        nfs:
          path: /nfs/hubs/rke2/staging/jupyterjsc
        livenessProbe:
          enabled: false
  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
    helm:
      values:
        global:
          hostname: jupyter.jsc.fz-juelich.de
          loggerName: JupyterJSC
        nfs:
          path: /nfs/hubs/rke2/production/jupyterjsc
