defaultNamespace: jupyterjsc

labels:
  app: jupyterjsc
  component: custom

dependsOn:
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces

helm:
  releaseName: jupyterjsc-custom
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-hub-customizations
  version: 0.15.36
  values:
    fullnameOverride: jupyterjsc-custom
    global:
      name: jupyterjsc
      namespace: jupyterjsc
    customConfig:
      announcement:
        show: false
        title: "18th of December JupyterLabs stopped"
        body: "An error in the database led to an inconsistent state. We had to stop all running JupyterLabs. We are sorry for the inconvenience caused."
    ingress:
      enabled: true
    jupyter-metrics:
      enabled: true
      nodeSelector:
        worker: "true"
      secretSuffixes:
        - metrics
        - metrics-codebase
    jupyter-user-kpi:
      enabled: true
      nodeSelector:
        worker: "true"
      secretSuffixes:
        - user-kpi-codebase
    logging:
      syslog:
        enabled: true
        level: 10
targetCustomizations:
  - name: jupyter-stag
    clusterSelector:
      matchLabels:
        stage: staging
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: jupyter-staging.jsc.fz-juelich.de
          baseUrl: /
          loggerName: JupyterJSCStaging
        nfs:
          path: /nfs/hubs/rke2/staging/jupyterjsc
        redirectEditInPlace: "false"
        redirects:
          - name: "staging"
            oldHost: "jupyter-jsc-staging.fz-juelich.de"
            newHost: "jupyter-staging.jsc.fz-juelich.de"
          - name: "staging-docs"
            oldHost: "docs.jupyter-staging.jsc.fz-juelich.de"
            newHost: "jupyterjsc.pages.jsc.fz-juelich.de/docs/jupyterjsc/"
          - name: "staging-docs-prev"
            oldHost: "docs.jupyter-jsc-staging.fz-juelich.de"
            newHost: "jupyterjsc.pages.jsc.fz-juelich.de/docs/jupyterjsc/"
  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
        prep: "false"
    helm:
      values:
        global:
          hostname: jupyter.jsc.fz-juelich.de
          loggerName: JupyterJSC
        nfs:
          path: /nfs/hubs/rke2/production/jupyterjsc
        redirectEditInPlace: "false"
        redirects:
          - name: "production"
            oldHost: "jupyter-jsc.fz-juelich.de"
            newHost: "jupyter.jsc.fz-juelich.de"
          - name: "production-docs-prev"
            oldHost: "docs.jupyter-jsc.fz-juelich.de"
            newHost: "jupyterjsc.pages.jsc.fz-juelich.de/docs/jupyterjsc/"
          - name: "production-docs"
            oldHost: "docs.jupyter.jsc.fz-juelich.de"
            newHost: "jupyterjsc.pages.jsc.fz-juelich.de/docs/jupyterjsc/"
  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
        prep: "true"
    helm:
      values:
        ingress:
          certmanager: false
        global:
          hostname: zam12185.zam.kfa-juelich.de
          # hostname: jupyter.jsc.fz-juelich.de
          baseUrl: /jupyterjsc/
          loggerName: JupyterJSC
          tlssecretname: zam12185
        nfs:
          path: /nfs/hubs/rke2/production/jupyterjsc
