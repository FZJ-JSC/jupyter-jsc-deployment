---
defaultNamespace: jupyterjsc

labels:
  app: jupyterjsc
  component: custom

dependsOn:
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces

helm:
  releaseName: jupyterjsc-custom
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-hub-customizations
  version: 0.16.73
  values:
    dailyRestart:
      enabled: false
    fullnameOverride: jupyterjsc-custom
    global:
      name: jupyterjsc
      namespace: jupyterjsc
    customConfig:
      services:
        JupyterLab:
          defaultOption: "4.3"
          "4.3":
            allowedLists:
              systems:
                - JURECA
                - JUWELS
                - JUPITER
                - JUSUF
                - JSC-Cloud
          vscode:
            enabled: true
            allowedLists:
              groups:
                - "geant:dfn.de:fz-juelich.de:jsc:jupyter:beta_tester"
    ingress:
      enabled: true
    jupyter-metrics:
      enabled: true
      nodeSelector:
        worker: "true"
      secretSuffixes:
        - metrics
        - metrics-codebase
    jupyter-user-kpi:
      enabled: true
      nodeSelector:
        worker: "true"
      secretSuffixes:
        - user-kpi-codebase
    logging:
      stream:
        level: 10
      syslog:
        enabled: true
        level: 10
targetCustomizations:
  - name: jupyter-stag
    clusterSelector:
      matchLabels:
        stage: staging
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: jupyter-staging.jsc.fz-juelich.de
          baseUrl: /
          loggerName: JupyterJSCStaging
        nfs:
          path: /nfs/hubs/rke2/staging/jupyterjsc
        redirectEditInPlace: "false"
        redirects:
          - name: "staging"
            oldHost: "jupyter-jsc-staging.fz-juelich.de"
            newHost: "jupyter-staging.jsc.fz-juelich.de"
          - name: "staging-docs"
            oldHost: "docs.jupyter-staging.jsc.fz-juelich.de"
            newHost: "jupyterjsc.pages.jsc.fz-juelich.de/docs/jupyterjsc/"
          - name: "staging-docs-prev"
            oldHost: "docs.jupyter-jsc-staging.fz-juelich.de"
            newHost: "jupyterjsc.pages.jsc.fz-juelich.de/docs/jupyterjsc/"
  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
        maintenance: "false"
    helm:
      values:
        global:
          hostname: jupyter.jsc.fz-juelich.de
          loggerName: JupyterJSC
        nfs:
          path: /nfs/hubs/rke2/production/jupyterjsc
        sidecarCheckInterval: 300
        redirectEditInPlace: "false"
        redirects:
          - name: "production"
            oldHost: "jupyter-jsc.fz-juelich.de"
            newHost: "jupyter.jsc.fz-juelich.de"
          - name: "production-docs-prev"
            oldHost: "docs.jupyter-jsc.fz-juelich.de"
            newHost: "jupyterjsc.pages.jsc.fz-juelich.de/docs/jupyterjsc/"
          - name: "production-docs"
            oldHost: "docs.jupyter.jsc.fz-juelich.de"
            newHost: "jupyterjsc.pages.jsc.fz-juelich.de/docs/jupyterjsc/"
  - name: jupyter-prod-maintenance
    clusterSelector:
      matchLabels:
        stage: production
        maintenance: "true"
    helm:
      values:
        ingress:
          certmanager: false
        global:
          hostname: zam12154.zam.kfa-juelich.de
          # hostname: jupyter.jsc.fz-juelich.de
          baseUrl: /jupyterjsc/
          loggerName: JupyterJSC
          tlssecretname: zam12154
        nfs:
          path: /nfs/hubs/rke2/production/jupyterjsc
        # redirects:
        #   - name: "production"
        #     oldHost: "jupyter-jsc.fz-juelich.de"
        #     newHost: "jupyter.jsc.fz-juelich.de"
        #   - name: "production-nbviewer"
        #     oldHost: "docs.jupyter-jsc.fz-juelich.de"
        #     newHost: "docs.jupyter.jsc.fz-juelich.de"
