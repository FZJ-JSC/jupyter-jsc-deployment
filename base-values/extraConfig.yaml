      async def alt_names(spawner):
          system = spawner.user_options.get("system", "unknown")
          config = get_custom_config()
          backend_service = config.get("systems", {}).get(system, {}).get("backendService", "UNKNOWN")
          namespace = config.get("backendServices", {}).get(backend_service, {}).get("namespace", "jupyter")
