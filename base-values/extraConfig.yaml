---
hub:
  extraConfig:
    customConfig: |-
      import inspect
      import jsc_custom
      import logging
      import os
      ## Generic information
      namespace = os.environ.get("POD_NAMESPACE", "default")
      jupyterhub_host = get_name("hub")

      jhub_hostname = jsc_custom.spawner.jhub_hostname()

      ## Misc Hub configs
      base_url = c.JupyterHub.get("base_url", "/")

      from jsc_custom.proxy import SSLTraefikEtcdProxy
      c.JupyterHub.proxy_class = SSLTraefikEtcdProxy

      c.SSLTraefikEtcdProxy.etcd_url = "http://etcd.etcd.svc:2379"
      c.SSLTraefikEtcdProxy.should_start = False
      c.SSLTraefikEtcdProxy.skip_hub_route = True
      c.SSLTraefikEtcdProxy.skip_services_route = False
      c.SSLTraefikEtcdProxy.enable_setup_dynamic_config = False
      c.SSLTraefikEtcdProxy.traefik_http_servers_transport = f"{namespace}-{namespace}@kubernetescrd"
      c.SSLTraefikEtcdProxy.traefik_router_middlewares = [] # [f"{namespace}-buffering@kubernetescrd"]
      c.SSLTraefikEtcdProxy.traefik_api_url = "http://traefik-internal.traefik.svc:8080"
      c.SSLTraefikEtcdProxy.traefik_api_entrypoint = "traefik"
      c.SSLTraefikEtcdProxy.traefik_entrypoint = "web"
      c.SSLTraefikEtcdProxy.traefik_alias_prefix = namespace
      c.SSLTraefikEtcdProxy.kv_jupyterhub_prefix = namespace
      c.SSLTraefikEtcdProxy.traefik_enforce_host_in_rules = jhub_hostname

      ## Logging

      logged_logger_name = os.environ.get("LOGGER_NAME", "JupyterHub")

      c.JupyterHub.log_level = 10

      class AppLogLoggingFilter(logging.Filter):
          def filter(self, record):
              if str(record.msg).startswith("Authenticated with token"):
                  return False
              if record.filename in ["scopes.py"]:
                  return False
              if str(record.msg).startswith("Failed to connect to"):
                  return False
              if str(record.msg).startswith("Setting new xsrf cookie"):
                  return False
              if record.levelno == 30 and str(record.msg).endswith("Missing or invalid credentials."):
                  return False
              return True

      class AccessLogLoggingFilter(logging.Filter):
          def filter(self, record):
              if record.funcName in ["log_request"]:
                  return False
              if record.levelno == 30 and str(record.msg).endswith("Missing or invalid credentials."):
                  return False
              return True

      class JupyterHubLoggingFilter(logging.Filter):
          def filter(self, record):
              if str(record.msg).startswith("Failing suspected API request to not-running server"):
                  return False
              elif str(record.msg).startswith("Adding route for Hub:"):
                  return False
              return True

      class TornadoGeneralLoggingFilter(logging.Filter):
          def filter(self, record):
              if str(record.msg).startswith("Could not open static file"):
                  return False
              if record.levelno == 30 and str(record.msg).endswith("Missing or invalid credentials."):
                  return False
              return True

      # available usual logger keys:
      # "JupyterHub", "tornado", "tornado.application", "tornado.access", "tornado.general", "oauthlib"
      logging_filter_classes = {
          "tornado.application": AppLogLoggingFilter,
          "tornado.access": AccessLogLoggingFilter,
          "JupyterHub": JupyterHubLoggingFilter,
          "tornado.general": TornadoGeneralLoggingFilter
      }
      all_loggers = {name: logging.getLogger(name) for name in logging.root.manager.loggerDict if name in logging_filter_classes.keys()}
      all_loggers_true = {name: logging.getLogger(name) for name in logging.root.manager.loggerDict}
      for key, value in logging_filter_classes.items():
          all_loggers[key].addFilter(value())

      simple_fmt = f"%(asctime)s.%(msecs).03d logger={logged_logger_name} levelno=%(levelno)s levelname=%(levelname)s file=%(pathname)s line=%(lineno)d function=%(funcName)s : %(message)s"
      c.JupyterHub.log_format = simple_fmt

      ## Database
      db_host = os.environ.get("SQL_HOST")
      db_port = os.environ.get("SQL_PORT")
      db_user = os.environ.get("SQL_USER")
      db_password = os.environ.get("SQL_PASSWORD")
      db_database = os.environ.get("SQL_DATABASE")
      c.JupyterHub.db_url = f"postgresql://{db_user}:{db_password}@{db_host}:{db_port}/{db_database}"
      # juypterhub upgrade-db
      #  --db=postgresql://$SQL_USER:$SQL_PASSWORD@$SQL_HOST:$SQL_PORT/$SQL_DATABASE
      ## Static files + Templates
      # Call update incidents once to fill incidents dictionary
      from jsc_custom.misc import get_incidents
      from jsc_custom.misc import get_reservations
      from jsc_custom.misc import get_custom_config

      def frontendCollection(user=None):
          custom_config = get_custom_config()
          ret = {
              "hostname": jhub_hostname,
              "incidentCheck": custom_config.get("incidentCheck", {}),
              "systemConfig": custom_config.get("systems", {}),
              "mapSystems": {},
              "mapPartitions": {},
              "defaultPartitions": {},
              "serviceConfig": {},
              "userModules": {},
              "resourcesConfig": {},
              "backendServices": {},
              "incidents": {},
              "reservations": {},
              "decrypted_user_options": {},
              "userage": 0
          }
          if user:
              from jupyterhub.utils import utcnow
              from functools import partial
              utcnow = partial(utcnow, with_tz=False)
              ret.update({
                  "mapSystems": custom_config.get("mapSystems", {}),
                  "mapPartitions": custom_config.get("mapPartitions", {}),
                  "defaultPartitions": custom_config.get("defaultPartitions", {}),
                  "serviceConfig": custom_config.get("services", {}),
                  "userModules": custom_config.get("userModules", {}),
                  "resourcesConfig": custom_config.get("resources", {}),
                  "backendServices": custom_config.get("backendServices", {}),
                  "incidents": get_incidents(),
                  "reservations": get_reservations(),
                  "decrypted_user_options": jsc_custom.spawner.utils.decrypted_user_options(user),
                  "userage": (utcnow() - user.orm_user.created).total_seconds()
              })
          return ret

      c.JupyterHub.template_vars = {
          "frontendCollection": frontendCollection
      }

      ## Authenticator
      from jupyterhub_credit_service import CreditsAuthenticator
      import asyncio
      from jupyterhub import orm

      from jsc_custom.misc import get_global_sse

      global_sse = get_global_sse()
      async def task_hook():
          global_sse.set()
          await asyncio.sleep(0)
          global_sse.clear()

      #class Authenticator(jsc_custom.authenticator.CustomGenericOAuthenticator):
      class Authenticator(jsc_custom.authenticator.CustomGenericOAuthenticator, CreditsAuthenticator):
          cull_task = None

          # Check every 5 minutes
          cull_task_sleep = 300

          # Total max idle time: 3 / 5 days
          global_max_idle_time = 3 * 24 * 3600
          global_user_max_idle_time = 5 * 24 * 3600
          
          # Return list because sets are not JSON serializable
          async def get_user_groups(self, auth_state: dict):
              groups = await super().get_user_groups(auth_state)
              if type(groups) == set:
                  groups = list(groups)
              return groups

          async def flavor_based_culling(self):
              def done_callback(fut):
                  asyncio.create_task(task_hook())
              while True:
                  for user_name, mem_user in self.user_credits_dict.items():
                      for spawner in mem_user.spawners.values():
                          if not spawner.ready:
                              continue
                          system = spawner.user_options.get("system", None)
                          flavor = spawner.user_options.get("flavor", None)
                          if not flavor or not system:
                              # HPC systems are not culled at the moment
                              continue
                          auth_state = await mem_user.get_auth_state()
                          outpost_flavors = auth_state.get("outpost_flavors", {})
                          if not outpost_flavors:
                              continue
                          flavor_config = outpost_flavors.get(system, {}).get(flavor, {})
                          if not flavor_config:
                              continue
                          max_idle_time = flavor_config.get("max_idle_time", None)
                          last_activity = spawner.last_activity
                          now = orm.utcnow()
                          idle_time = (now - last_activity).total_seconds()
                          if idle_time > self.global_max_idle_time:
                              self.log.info("Culling user %s spawner %s due to global max idle time exceeded (%s > %s)", user_name, spawner.name, idle_time, self.global_max_idle_time)
                              task = asyncio.create_task(mem_user.stop(spawner.name))
                              task.add_done_callback(done_callback)
                          user_last_activity = mem_user.orm_user.last_activity
                          user_idle_time = (now - user_last_activity).total_seconds()
                          if user_idle_time > self.global_user_max_idle_time:
                              self.log.info("Culling user %s spawner %s due to global user max idle time exceeded (%s > %s)", user_name, spawner.name, user_idle_time, self.global_user_max_idle_time)
                              task = asyncio.create_task(mem_user.stop(spawner.name))
                              task.add_done_callback(done_callback)
                          if not max_idle_time:
                              continue
                          if idle_time > max_idle_time:
                              self.log.info("Culling user %s spawner %s due to flavor based max idle time exceeded (%s > %s)", user_name, spawner.name, idle_time, max_idle_time)
                              task = asyncio.create_task(mem_user.stop(spawner.name))
                              task.add_done_callback(done_callback)
                  await asyncio.sleep(self.cull_task_sleep)

          def __init__(self, **kwargs):
              super().__init__(**kwargs)
              self.cull_task = asyncio.create_task(self.flavor_based_culling())

      async def credits_user(authenticator, user_name, user_groups, user_admin, auth_state):
          from datetime import datetime
          import json
          from tornado.httpclient import HTTPRequest
          from jupyterhub_credit_service.orm import CreditsUser

          if type(user_groups) == set:
              user_groups = list(user_groups)

          custom_config = get_custom_config()
          ret = []
          tasks = []
          system_names = []

          orm_credits = CreditsUser.get_user(authenticator.parent.db, user_name)
          prev_credits_per_system = {}
          if orm_credits and orm_credits.credits_user_values:
              for cuv in orm_credits.credits_user_values:
                  if cuv.user_options and "system" in cuv.user_options:
                      prev_credits_per_system[cuv.user_options["system"]] = {
                          "name": cuv.user_options["system"],
                          "cap": cuv.cap,
                          "grant_value": cuv.grant_value,
                          "grant_interval": cuv.grant_interval,
                          "user_options": cuv.user_options
                      }
                      if cuv.project:
                          prev_credits_per_system[cuv.user_options["system"]]["project"] = {
                              "name": cuv.project.name,
                              "cap": cuv.project.cap,
                              "grant_value": cuv.project.grant_value,
                              "grant_interval": cuv.project.grant_interval
                          }

          for system, system_config in custom_config.get("systems", {}).items():
              outpost_name = system_config.get("backendService", "")
              outpost_config = custom_config.get("backendServices", {}).get(outpost_name, {})
              user_credits = outpost_config.get("urls", {}).get("usercredits", False)
              if user_credits:
                  request_kwargs = system_config.get("usercredits", {}).get("requestKwargs", {"request_timeout": 2})
                  auth = os.environ.get(f"AUTH_{outpost_name.upper()}")
                  body = {
                      "username": user_name,
                      "groups": user_groups,
                      "email": auth_state.get("email", "")
                  }
                  if system_config.get("usercredits", {}).get("sendAuthState", False):
                      body["auth_state"] = auth_state
                  req = HTTPRequest(
                      user_credits,
                      method="POST",
                      headers={"Authorization": f"Basic {auth}"},
                      body=json.dumps(body),
                      **request_kwargs,
                  )
                  tasks.append(authenticator.http_client.fetch(req, raise_error=False))
                  system_names.append(system)
          try:
              results = await asyncio.gather(*tasks, return_exceptions=True)
              names_results = list(zip(system_names, results))
              for name_result in names_results:
                  try:
                      if name_result[1].code == 200:
                          authenticator.log.debug(
                              f"OutpostCredits user specific - {name_result[0]} successful"
                          )
                          result_json = json.loads(name_result[1].body)
                          if result_json:
                              if len(result_json) > 1:
                                  authenticator.log.info(f"OutpostCredits user specific - {name_result[0]} - Result has {len(result_json)} items, use first one.")
                              result = max(result_json.values(), key=lambda x: x.get("weight", 0))
                              result["user_options"] = {"system": name_result[0]}
                              if "name" not in result:
                                  result["name"] = name_result[0]
                              ret.append(result)
                      else:
                          if name_result[0] in prev_credits_per_system:
                              authenticator.log.warning(
                                  f"OutpostCredits user specific - {name_result[0]} - Using previous credits due to error {name_result[1].code} ({name_result[1]})"
                              )
                              ret.append(prev_credits_per_system[name_result[0]])
                          else:
                              authenticator.log.warning(
                                  f"OutpostCredits user specific - {name_result[0]} - Answered with {name_result[1].code} ({name_result[1]})"
                              )
                  except:
                      authenticator.log.exception(
                          f"OutpostCredits user specific - {name_result[0] if len(name_result) > 0 else 'unknown'} Could not load result into json"
                      )
          except:
              authenticator.log.exception("OutpostCredits user specific - Could not load credits")
          
          workshops_configured = get_custom_config().get("workshopcredits", {})
          if not workshops_configured:
              return ret
          email = ""
          for group in user_groups:
              if group.startswith("email:"):
                  email = group.split("email:")[1]
                  break
          if not email:
              return ret

          from jsc_custom.orm.workshops import WorkshopShares
          # Check every cuv value if a user is part of a workshop
          for cuv in ret:
              # run through all workshops in custom configuration
              for workshop_name, workshop_config in sorted(workshops_configured.items(), key=lambda x: x[1].get("priority", 1)):
                  if workshop_config.get("enabled", False) == False:
                      authenticator.log.debug(f"Do not add workshop credits for user {user_name}. Workshop {workshop_name} is disabled, skipping")
                      continue
                  start_time = datetime.strptime(workshop_config['start'], "%Y-%m-%d %H:%M")
                  end_time = datetime.strptime(workshop_config['end'], "%Y-%m-%d %H:%M")
                  if not (start_time <= datetime.now() <= end_time):
                      authenticator.log.debug(f"Do not add workshop credits for user {user_name}. Workshop {workshop_name} is not active yet, skipping")
                      continue
                  if cuv.get("user_options") == workshop_config.get("credits", {}).get("user_options", {}):
                      # Check if user is part of the workshop in the database
                      workshop_db = WorkshopShares.find_by_workshop_id(authenticator.parent.db, workshop_name)
                      if workshop_db:
                          workshop_userlist = [x for x in workshop_db.user_options.get("userlist", "").split("\n") if x.startswith("#") == False and x.strip() != ""]
                          if email in workshop_userlist:
                              authenticator.log.debug(f"Adding workshop credits for user {user_name} for workshop {workshop_name}")
                              workshop_credits = workshop_config.get("credits", {})
                              # Add workshop credits
                              cuv["project"] = {
                                  "name": workshop_config.get("display_name", workshop_name),
                                  "cap": workshop_credits.get("cap", 0),
                                  "grant_value": workshop_credits.get("grant_value", 0),
                                  "grant_interval": workshop_credits.get("grant_interval", 0)
                              }
          return ret

      c.JupyterHub.authenticator_class = Authenticator

      c.Authenticator.credits_task_interval = 180

      c.Authenticator.credits_task_post_hook = task_hook
      c.Authenticator.credits_user = credits_user
      c.Authenticator.manage_groups = True
      c.Authenticator.basic_auth = True
      c.Authenticator.enable_auth_state = True
      c.Authenticator.refresh_pre_spawn = True
      c.Authenticator.refresh_pre_stop = True
      c.Authenticator.allow_all = True
      c.Authenticator.client_id = os.environ.get("OAUTH_CLIENT_ID")
      c.Authenticator.client_secret = os.environ.get("OAUTH_CLIENT_SECRET")
      c.Authenticator.oauth_callback_url = (
          f"https://{jhub_hostname}{base_url}hub/oauth_callback"
      )

      claim_name = None
      admin_users = {}
      tokeninfo_url = None
      revocation_url = None
      end_session_url = None
      revocation_type = "Unity"

      res_groups_pattern = re.compile(
          r"^urn:"
          r"(?P<namespace>.+?(?=:res:)):"
          r"res:"
          r"(?P<parentgroup>[^:]+)?"
          r"(?::(?!role=)(?P<childgroup>[^:#]+))?"
          r"(?::(?!role=)(?P<grandchildgroup>[^:#]+))?"
          r"(?::role=(?P<role>[^#]+))?"
          r"#(?P<authority>.+)$"
      )

      group_pattern = re.compile(
          r"^urn:"
          r"(?P<namespace>.+?(?=:group:)):"
          r"group:"
          r"(?P<parentgroup>[^:]+)?"
          r"(?::(?!role=)(?P<childgroup>[^:#]+))?"
          r"(?::(?!role=)(?P<grandchildgroup>[^:#]+))?"
          r"(?::role=(?P<role>[^#]+))?"
          r"#(?P<authority>.+)$"
      )

      def _group_management(user_info):
          """
          Return all groups a user is part of
          """
          groups = ["default"]

          entitlements = user_info.get(
              "entitlements", user_info.get("oauth_user", {}).get("entitlements", [])
          )
          if type(entitlements) == str:
              entitlements = entitlements.split()

          def add_sub_groups(group, role, authority, rightmost_group=True):
              if role and rightmost_group:
                  group_role = f"{group}:role={role}"
                  if group_role not in groups:
                      groups.append(group_role)
              if authority:
                  group_authority = f"{group}#{authority}"
                  if group_authority not in groups:
                      groups.append(group_authority)
              if role and rightmost_group and authority:
                  group_role_authority = f"{group}:role={role}#{authority}"
                  if group_role_authority not in groups:
                      groups.append(group_role_authority)

          schac_home_organization = user_info.get("schac_home_organization", user_info.get("oauth_user", {}).get("schac_home_organization", None))
          if schac_home_organization:
              groups.append(f"schac_home_organization:{schac_home_organization}")
          eduperson_assurance = user_info.get("eduperson_assurance", user_info.get("oauth_user", {}).get("eduperson_assurance", []))
          for assurance in eduperson_assurance:
              groups.append(f"eduperson_assurance:{assurance}")

          for entry in entitlements:
              match = group_pattern.match(entry)
              if match:
                  namespace = match.group("namespace")
                  grandchildgroup = match.group("grandchildgroup")
                  childgroup = match.group("childgroup")
                  parentgroup = match.group("parentgroup")
                  role = match.group("role")
                  authority = match.group("authority")
                  rightmost_group = True
                  if grandchildgroup:
                      group = f"urn:{namespace}:group:{parentgroup}:{childgroup}:{grandchildgroup}"
                      if group not in groups:
                          groups.append(group)
                      add_sub_groups(group, role, authority, rightmost_group)
                      rightmost_group = False
                  if childgroup:
                      group = f"{namespace}:{parentgroup}:{childgroup}"
                      if group not in groups:
                          groups.append(group)
                      add_sub_groups(group, role, authority, rightmost_group)
                      rightmost_group = False
                  if parentgroup:
                      group = f"{namespace}:{parentgroup}"
                      if group not in groups:
                          groups.append(group)
                      add_sub_groups(group, role, authority, rightmost_group)
                      rightmost_group = False
              else:
                  match = res_groups_pattern.match(entry)
                  if match:
                      namespace = match.group("namespace")
                      grandchildgroup = match.group("grandchildgroup")
                      childgroup = match.group("childgroup")
                      parentgroup = match.group("parentgroup")
                      role = match.group("role")
                      authority = match.group("authority")
                      rightmost_group = True
                      if grandchildgroup:
                          group = f"urn:{namespace}:group:{parentgroup}:{childgroup}:{grandchildgroup}"
                          if group not in groups:
                              groups.append(group)
                          add_sub_groups(group, role, authority, rightmost_group)
                          rightmost_group = False
                      if childgroup:
                          group = f"{namespace}:{parentgroup}:{childgroup}"
                          if group not in groups:
                              groups.append(group)
                          add_sub_groups(group, role, authority, rightmost_group)
                          rightmost_group = False
                      if parentgroup:
                          group = f"{namespace}:{parentgroup}"
                          if group not in groups:
                              groups.append(group)
                          add_sub_groups(group, role, authority, rightmost_group)
                          rightmost_group = False

          for attribute in ["org_domain", "voperson_external_affiliation"]:
              value = user_info.get(attribute, None)
              if value and type(value) == list:
                  groups.extend(value)
              elif value and type(value) == str:
                  groups.append(value)
          oauth_user = user_info.get("oauth_user", user_info)
          email = oauth_user.get("email", None)
          if email:
              groups.append(f"email:{email}")

          displayname = oauth_user.get("name", email)
          if displayname:
              groups.append(f"displayname:{displayname}")

          return groups

      group_management = _group_management

      if namespace in ["nfdigeneral"]:
          admin_users = {
              'i.ouled.elhaj_at_fz-juelich.de',
              'a6e989845cc0490bbefdd3767085db7a@login.helmholtz.de',
          }

          def _claim_name(resp_json):
              if "voperson_id" in resp_json.keys():
                  name = resp_json["voperson_id"]
                  if type(name) == list:
                      name = name[0]
              elif "sub" in resp_json.keys():
                  name = resp_json["sub"]
              else:
                  name = resp_json["email"].replace("@", "_at_")
              assert name is not None
              return name
          claim_name = _claim_name
          authorize_url = "https://infraproxy.nfdi-aai.dfn.de/idp/profile/oidc/authorize"
          token_url = "https://infraproxy.nfdi-aai.dfn.de/idp/profile/oidc/token"
          userdata_url = "https://infraproxy.nfdi-aai.dfn.de/idp/profile/oidc/userinfo"
          tokeninfo_url = None
          revocation_type = "InfraProxy"
          revocation_url = "https://infraproxy.nfdi-aai.dfn.de/idp/profile/oauth2/revocation"
          end_session_url = None # "https://infraproxy.nfdi-aai.dfn.de/idp/profile/oidc/end-session"
          oauth_scopes = [
              "openid",
              "email",
              "offline_access",
              "voperson_external_affiliation",
          ]
      else:
          authorize_url = "https://login.jsc.fz-juelich.de/oauth2-as/oauth2-authz"
          token_url = "https://login.jsc.fz-juelich.de/oauth2/token"
          userdata_url = "https://login.jsc.fz-juelich.de/oauth2/userinfo"
          tokeninfo_url = "https://login.jsc.fz-juelich.de/oauth2/tokeninfo"
          oauth_scopes = [
              "openid",
              "email",
              "profile",
              "eduperson_assurance",
              "single-logout",
              "voperson_id",
              "entitlements",
          ]

          admin_users = {
              'i.ouled.elhaj_at_fz-juelich.de',
              't.kreuzer_at_fz-juelich.de',
          }
          res_pattern = re.compile(
              r"^urn:"
              r"(?P<namespace>.+?(?=:res:)):"
              r"res:"
              r"(?P<systempartition>[^:]+):"
              r"(?P<project>[^:]+):"
              r"act:"
              r"(?P<account>[^:]+):"
              r"(?P<accounttype>[^:]+)$"
          )
          def _claim_name(resp_json):
              if "preferred_username" in resp_json.keys():
                  preferred_username_is_secondary = False
                  for entitlement in resp_json.get("entitlements", []):
                      match = res_pattern.match(entitlement)
                      if match:
                          account = match.group("account")
                          accounttype = match.group("accounttype")
                          if account == resp_json["preferred_username"]:
                              if accounttype == "secondary":
                                  preferred_username_is_secondary = True
                              break
                  if preferred_username_is_secondary:
                      return resp_json["preferred_username"] + "." + resp_json["email"].replace("@", "_at_")
              return resp_json["email"].replace("@", "_at_")
          claim_name = _claim_name

