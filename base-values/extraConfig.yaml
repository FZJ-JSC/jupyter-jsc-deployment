          import base64
          usernamepassword = base64.b64decode(usernamepasswordb64).decode()
          username = usernamepassword.split(":")[0]

          return [f"DNS:{username}-{spawner.name}-{spawner.user.id}.{namespace}.svc", f"DNS:{jhub_hostname}"]

