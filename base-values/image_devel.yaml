---
hub:
  image:
    pullPolicy: "Always"
    name: registry.jsc.fz-juelich.de/jupyterjsc/k8s/images/jhub
    tag: "devel"
  args:
    - -c
    - >-
      /src/entrypoint.sh
  command:
    - /bin/bash
  containerSecurityContext:
    runAsGroup: 0
    runAsUser: 0
    allowPrivilegeEscalation: true
    capabilities:
      drop: []
  podSecurityContext:
    runAsNonRoot: false
