---
defaultNamespace: traefik

labels:
  app: traefik
  component: secrets

helm:
  timeoutSeconds: 1200
  waitForJobs: true

targetCustomizations:
  - name: staging
    clusterSelector:
      matchLabels:
        stage: staging
    kustomize:
      dir: overlays/staging
  - name: production
    clusterSelector:
      matchLabels:
        stage: production
    kustomize:
      dir: overlays/production
