defaultnamespace: jupyter

labels:
  app: maintenance
  component: nginx

dependsOn:
  - selector:
      matchLabels:
        app: maintenance
        component: secrets
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces



helm:
  releaseName: maintenance
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-maintenance
  version: 0.9.0
  valuesFiles:
    - values/base/misc.yaml
targetCustomizations:
  - name: staging
    clusterSelector:
      matchLabels:
        stage: staging
        maintenance: "false"
    doNotDeploy: true
  - name: staging
    clusterSelector:
      matchLabels:
        stage: staging
        maintenance: "true"
    helm:
      valuesFiles:
        - values/overlays/staging/hosts.yaml
      values:
        enabled: false
  - name: production
    clusterSelector:
      matchLabels:
        stage: production
        prep: "false"
    helm:
      valuesFiles:
        - values/overlays/production/hosts.yaml
      values:
        enabled: false
  - name: production
    clusterSelector:
      matchLabels:
        stage: production
        prep: "true"
    helm:
      valuesFiles:
        - values/overlays/production-prep/hosts.yaml
      values:
        enabled: true
    doNotDeploy: true
