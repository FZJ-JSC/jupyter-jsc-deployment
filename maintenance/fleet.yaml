---
defaultNamespace: jupyter

labels:
  app: maintenance
  component: nginx

dependsOn:
  - selector:
      matchLabels:
        app: maintenance
        component: secrets
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces

helm:
  releaseName: maintenance
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-maintenance
  version: 0.10.0
  values:
    enabled: true
    fullnameOverride: "jhub-maintenance"
targetCustomizations:
  - name: staging
    clusterSelector:
      matchLabels:
        stage: staging
    doNotDeploy: true
    helm:
      values:
        traefik:
          hosts:
            - jupyter-staging.jsc.fz-juelich.de
            - juniq-staging.fz-juelich.de
            - hub-staging.nfdi-jupyter.de
            - portal-staging.gauss-centre.eu
            - jupyter-staging.eurocc-gcs.de
            - jupyter-staging.coe-raise.eu
            - jupyter-coec-staging.jsc.fz-juelich.de
            - twin-staging.ebrains.eu
  - name: production
    clusterSelector:
      matchLabels:
        stage: production
    doNotDeploy: false
    helm:
      values:
        traefik:
          hosts:
            # - jupyter.jsc.fz-juelich.de
            - juniq.fz-juelich.de
            - hub.nfdi-jupyter.de
            - portal.gauss-centre.eu
            # - jupyter.eurocc-gcs.de
            - jupyter.coe-raise.eu
            - jupyter-coec.jsc.fz-juelich.de
            - twin.ebrains.eu
