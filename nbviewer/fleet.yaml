defaultnamespace: jupyter
helm:
  values:
    image:
      tag: "1.1.4"
    nodeSelector:
      worker: "true"
    podAnnotations:
      proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
    ingress:
      annotations:
        acme.cert-manager.io/http01-edit-in-place: "false"
        cert-manager.io/cluster-issuer: letsencrypt-cluster-issuer
targetCustomizations:
  - name: jupyter-stag-rke2
    clusterSelector:
      matchLabels:
        name: jupyter-stag
    helm:
      values:
        ingress:
          hosts:
            - host: zam12246.zam.kfa-juelich.de
              paths:
                - path: /nbviewer
                  pathType: Prefix
              svcName: nbviewer
              svcPort: 8080
          tls:
            - secretName: jupyter-jsc-certs
              hosts:
                - zam12246.zam.kfa-juelich.de
        labels:
          hostname: zam12246.zam.kfa-juelich.de
  - name: staging
    clusterSelector:
      matchLabels:
        stage: staging
        app: jupyter
    helm:
      values:
        ingress:
          hosts:
            - host: docs.jupyter-staging.jsc.fz-juelich.de
              paths:
                - path: /
                  pathType: Prefix
              svcName: nbviewer
              svcPort: 8080
          tls:
            - secretName: jupyter-jsc-certs
              hosts:
                - docs.jupyter-staging.jsc.fz-juelich.de
        labels:
          hostname: jupyter-staging.jsc.fz-juelich.de
  - name: production
    clusterSelector:
      matchLabels:
        stage: production
        provider.cattle.io: rke
    helm:
      values:
        ingress:
          hosts:
            - host: docs.jupyter.jsc.fz-juelich.de
              paths:
                - path: /
                  pathType: Prefix
              svcName: nbviewer
              svcPort: 8080
          tls:
            - secretName: jupyter-jsc-certs
              hosts:
                - docs.jupyter.jsc.fz-juelich.de
        labels:
          hostname: jupyter.jsc.fz-juelich.de

dependsOn:
  - selector:
      matchLabels:
        create-database: "true"