defaultnamespace: jupyter

labels:
  app: nbviewer
  component: main

dependsOn:
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces
  - selector:
      matchLabels:
        app: nbviewer
        component: secrets

helm:
  values:
    image:
      tag: "1.1.4"
    nodeSelector:
      worker: "true"
    podAnnotations:
      proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
    ingress:
      annotations:
        acme.cert-manager.io/http01-edit-in-place: "false"
        cert-manager.io/cluster-issuer: letsencrypt-cluster-issuer

targetCustomizations:
  - name: jupyter-stag
    clusterSelector:
      matchLabels:
        stage: staging
    helm:
      values:
        ingress:
          hosts:
            - host: docs.jupyter-staging.jsc.fz-juelich.de
              paths:
                - path: /
                  pathType: Prefix
              svcName: nbviewer
              svcPort: 8080
          tls:
            - secretName: jupyter-jsc-certs
              hosts:
                - docs.jupyter-staging.jsc.fz-juelich.de
        labels:
          hostname: jupyter-staging.jsc.fz-juelich.de
  - name: production
    clusterSelector:
      matchLabels:
        stage: production
        prep: "false"
    helm:
      values:
        ingress:
          hosts:
            - host: docs.jupyter.jsc.fz-juelich.de
              paths:
                - path: /
                  pathType: Prefix
              svcName: nbviewer
              svcPort: 8080
            - host: docs.jupyter-coec.jsc.fz-juelich.de
              paths:
                - path: /
                  pathType: Prefix
              svcName: nbviewer
              svcPort: 8080
            - host: docs.jupyter.coe-raise.eu
              paths:
                - path: /
                  pathType: Prefix
              svcName: nbviewer
              svcPort: 8080
            - host: docs.juniq.fz-juelich.de
              paths:
                - path: /
                  pathType: Prefix
              svcName: nbviewer
              svcPort: 8080
            - host: docs.hub.nfdi-jupyter.de
              paths:
                - path: /
                  pathType: Prefix
              svcName: nbviewer
              svcPort: 8080
            - host: docs.portal.gauss-centre.eu
              paths:
                - path: /
                  pathType: Prefix
              svcName: nbviewer
              svcPort: 8080
          tls:
            - secretName: jupyterjscdocs-tls
              hosts:
                - docs.jupyter.jsc.fz-juelich.de
            - secretName: coecdocs-tls
              hosts:
                - docs.jupyter-coec.jsc.fz-juelich.de
            - secretName: coeraisedocs-tls
              hosts:
                - docs.jupyter.coe-raise.eu
            - secretName: juniqdocs-tls
              hosts:
                - docs.juniq.fz-juelich.de
            - secretName: nfdigeneraldocs-tls
              hosts:
                - docs.hub.nfdi-jupyter.de
            - secretName: portalgaussdocs-tls
              hosts:
                - docs.portal.gauss-centre.eu
        labels:
          hostname: jupyter.jsc.fz-juelich.de
  - name: production
    clusterSelector:
      matchLabels:
        stage: production
        prep: "true"
    helm:
      values:
        ingress:
          annotations: null
          hosts:
            - host: zam12185.zam.kfa-juelich.de
              paths:
                - path: /nbviewer/
                  pathType: Prefix
              svcName: nbviewer
              svcPort: 8080
          tls:
            - secretName: zam12185
              hosts:
                - zam12185.zam.kfa-juelich.de
        labels:
          hostname: zam12185.zam.kfa-juelich.de
