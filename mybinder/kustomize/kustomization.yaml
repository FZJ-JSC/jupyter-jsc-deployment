patches:
  - target:
      kind: Deployment
      labelSelector: "app=jupyterhub"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: binder
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/1/secret/secretName
        value: buildpodsregistrycredentials
