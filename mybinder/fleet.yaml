defaultNamespace: binder

labels:
  app: binder
  component: main

dependsOn:
  - selector:
      matchLabels:
        app: binder
        component: secrets

kustomize:
  dir: ./kustomize

helm:
  releaseName: mybinder
  chart: mybinder
  values:
    analyticsPublisher:
      enabled: false
    awsEcrRegistryCleaner:
      enabled: false
    federationRedirect:
      enabled: false
    gcsProxy:
      enabled: false
    matomo:
      enabled: false
    minesweeper:
      enabled: false
    proxyPatches:
      enabled: false
    redirector:
      enabled: false
    registry:
      enabled: false
    static:
      enabled: false
    ingress-nginx:
      enabled: false
    prometheus:
      enabled: false
    grafana:
      enabled: false
    cryptnono:
      enabled: false
    cluster-autoscaler:
      enabled: false
    binderhub-container-registry-helper:
      enabled: false
    localpv-provisioner:
      enabled: false
    clusterIssuer:
      enabled: false
    buildkitPruner:
      buildkitCacheSize: 80GB
    binderhub:
      replicas: 1
      imageCleaner:
        enabled: false
      ingress:
        enabled: false
      jupyterhub:
        hub:
          db:
            type: sqlite-memory
        ingress:
          enabled: false
        scheduling:
          userScheduler:
            enabled: false
      networkPolicy:
        enabled: false
      hpa:
        enabled: false
      extraConfig:
        01-eventlog: |
          pass
        02-event-loop-metric: |
          pass
      config:
        BinderHub:
          build_node_selector:
            binder: "true"
          extra_footer_scripts: {}
          base_url: /services/binder/
          enable_api_only_mode: true
          image_prefix: registry.jsc.fz-juelich.de/jupyterjsc/repo2docker/
          push_secret: buildpodsregistrycredentials
        KubernetesBuildExecutor:
          node_selector:
            binder: "true"
        RateLimiter:
          period_seconds: 60
      nodeSelector:
        worker: "true"

