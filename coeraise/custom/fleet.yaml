defaultNamespace: coeraise

labels:
  app: coeraise
  component: custom


helm:
  releaseName: coeraise-custom
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-hub-customizations
  version: 0.15.12
  values:
    fullnameOverride: coeraise-custom
    global:
      name: coeraise
      namespace: coeraise
    ingress:
      enabled: true
    jupyter-metrics:
      enabled: true
      nodeSelector:
        worker: "true"
    logging:
      syslog:
        enabled: true
        level: 10
targetCustomizations:
  - name: jupyter-stag
    clusterSelector:
      matchLabels:
        stage: staging
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: jupyter-staging.coe-raise.eu
          baseUrl: /
          loggerName: CoeRaiseStaging
        nfs:
          path: /nfs/hubs/rke2/staging/coeraise
  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
        prep: "false"
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: jupyter.coe-raise.eu
          baseUrl: /
          loggerName: CoeRaise
        nfs:
          path: /nfs/hubs/rke2/production/coeraise
  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
        prep: "true"
    helm:
      values:
        ingress:
          certmanager: false
        global:
          hostname: zam12185.zam.kfa-juelich.de
          # hostname: jupyter.coe-raise.eu
          baseUrl: /coeraise/
          loggerName: CoeRaise
          tlssecretname: zam12185
        nfs:
          path: /nfs/hubs/rke2/production/coeraise