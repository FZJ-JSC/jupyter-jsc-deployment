---
defaultNamespace: coeraise

labels:
  app: coeraise
  component: custom

dependsOn:
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces

helm:
  releaseName: coeraise-custom
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-hub-customizations
  version: 0.16.43
  values:
    fullnameOverride: coeraise-custom
    global:
      name: coeraise
      namespace: coeraise
    ingress:
      enabled: true
    dailyRestart:
      enabled: false
    jupyter-metrics:
      enabled: true
      nodeSelector:
        worker: "true"
    logging:
      syslog:
        enabled: true
        level: 10
    customConfig:
      services:
        JupyterLab:
          "4.2":
            enabled: false
          "3.6":
            enabled: false
          "xpra":
            enabled: false
targetCustomizations:
  - name: jupyter-stag
    clusterSelector:
      matchLabels:
        stage: staging
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: jupyter-staging.coe-raise.eu
          baseUrl: /
          loggerName: CoeRaiseStaging
        nfs:
          path: /nfs/hubs/rke2/staging/coeraise
  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
        maintenance: "false"
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: jupyter.coe-raise.eu
          baseUrl: /
          loggerName: CoeRaise
        nfs:
          path: /nfs/hubs/rke2/production/coeraise
        redirectEditInPlace: "false"
        redirects:
          - name: "production-docs"
            oldHost: "docs.jupyter.coe-raise.eu"
            newHost: "jupyterjsc.pages.jsc.fz-juelich.de/docs/jupyterjsc/"
  - name: jupyter-prod-maintenance
    clusterSelector:
      matchLabels:
        stage: production
        maintenance: "true"
    helm:
      values:
        ingress:
          certmanager: false
        global:
          hostname: zam12154.zam.kfa-juelich.de
          # hostname: jupyter.coe-raise.eu
          baseUrl: /coeraise/
          loggerName: CoeRaise
          tlssecretname: zam12154
        nfs:
          path: /nfs/hubs/rke2/production/coeraise
