defaultnamespace: coeraise

labels:
  app: coeraise
  component: z2jh

dependsOn:
  - selector:
      matchLabels:
        app: coeraise
        component: secrets
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces

kustomize:
  dir: ./kustomize
helm:
  releaseName: coeraise
  # repo: https://jupyterhub.github.io/helm-chart/
  # chart: jupyterhub
  # version: 3.1.0
  chart: https://github.com/jupyterhub/helm-chart/raw/gh-pages/jupyterhub-4.2.0.tgz
  values:
    ingress:
      # Set JupyterHub in maintenance:
      #   Set enabled here to false, update ingress in maintenance/fleet.yaml
      enabled: true
  valuesFiles:
    - ../../base-values/extraConfig.yaml
    - ../../base-values/image.yaml
  valuesFrom:
    - configMapKeyRef:
        name: values
        namespace: coeraise
        key: values.yaml
    - secretKeyRef:
        name: static-hub-secret
        namespace: coeraise
        key: values.yaml

targetCustomizations:
  - name: production
    clusterSelector:
      matchLabels:
        stage: production
        maintenance: "false"
    helm:
      valuesFiles:
        - ../../base-values/image_prod.yaml
  - name: production
    clusterSelector:
      matchLabels:
        stage: production
        maintenance: "true"
    helm:
      valuesFiles:
        - ../../base-values/image_prod.yaml
        - ../../base-values/maintenance.yaml