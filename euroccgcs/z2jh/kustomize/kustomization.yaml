---
# InitContainer list in hub component:
# 0 - prepare-shared-data
# Container list in hub component:
# 0 - check-frontend-files
# 1 - sidecar-nginx
# 2 - hub
patches:
  - target:
      kind: Deployment
      labelSelector: component=hub
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom
        value:
          - secretRef:
              name: generics
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: PROXY_API_SERVICE_PORT
          value: "8001"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: PROXY_API_SERVICE_HOST
          value: "_"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: PROXY_PUBLIC_SERVICE_PORT
          value: "443"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: PROXY_PUBLIC_SERVICE_HOST
          value: "_"
  - target:
      kind: Ingress
      group: networking.k8s.io
      version: v1
      labelSelector: app=jupyterhub
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: traefik
      - op: replace
        path: /spec/rules/0/http/paths/0/backend/service/name
        value: traefik
      - op: replace
        path: /spec/rules/0/http/paths/0/backend/service/port/name
        value: web

patchesStrategicMerge:
  - |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: proxy
    $patch: delete
  - |
    apiVersion: v1
    kind: Service
    metadata:
      name: proxy-public
    $patch: delete
  - |
    apiVersion: v1
    kind: Service
    metadata:
      name: proxy-api
    $patch: delete
