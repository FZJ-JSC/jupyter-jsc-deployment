defaultNamespace: euroccgcs

labels:
  app: euroccgcs
  component: custom

dependsOn:
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces

helm:
  releaseName: euroccgcs-custom
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-hub-customizations
  version: 0.15.38
  values:
    fullnameOverride: euroccgcs-custom
    global:
      name: euroccgcs
      namespace: euroccgcs
    dailyRestart:
      enabled: false
    ingress:
      enabled: true
    jupyter-metrics:
      enabled: true
      nodeSelector:
        worker: "true"
    logging:
      syslog:
        enabled: true
        level: 10
    customConfig:
      announcement:
        show: true
        title: "Upcoming Maintenance - 20 Mar 2025, 08.30 - 18.30"
        body: "All running JupyterLabs will be stopped during this maintenance."
targetCustomizations:
  - name: jupyter-stag
    clusterSelector:
      matchLabels:
        stage: staging
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: jupyter-staging.eurocc-gcs.de
          baseUrl: /
          loggerName: EuroCCGCSStaging
        nfs:
          path: /nfs/hubs/rke2/staging/euroccgcs
  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
        prep: "false"
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: jupyter.eurocc-gcs.de
          baseUrl: /
          loggerName: EuroCCGCS
        nfs:
          path: /nfs/hubs/rke2/production/euroccgcs
  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
        prep: "true"
    helm:
      values:
        ingress:
          certmanager: false
        global:
          hostname: zam12185.zam.kfa-juelich.de
          # hostname: jupyter.eurocc-gcs.de
          baseUrl: /euroccgcs/
          loggerName: EuroCCGCS
          tlssecretname: zam12185
        nfs:
          path: /nfs/hubs/rke2/production/euroccgcs