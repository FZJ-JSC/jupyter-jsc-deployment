defaultNamespace: euroccgcs

labels:
  app: euroccgcs
  component: custom

dependsOn:
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces

helm:
  releaseName: euroccgcs-custom
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-hub-customizations
  version: 0.16.19
  values:
    fullnameOverride: euroccgcs-custom
    global:
      name: euroccgcs
      namespace: euroccgcs
    dailyRestart:
      enabled: false
    ingress:
      enabled: true
    jupyter-metrics:
      enabled: true
      nodeSelector:
        worker: "true"
    logging:
      syslog:
        enabled: true
        level: 10
    customConfig:
      services:
        JupyterLab:
          defaultOption: "4.3"
          "4.3":
            allowedLists:
              systems:
                - JURECA
                - JUWELS
                - JEDI
                - JUSUF
                - JSC-Cloud
targetCustomizations:
  - name: jupyter-stag
    clusterSelector:
      matchLabels:
        stage: staging
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: jupyter-staging.eurocc-gcs.de
          baseUrl: /
          loggerName: EuroCCGCSStaging
        nfs:
          path: /nfs/hubs/rke2/staging/euroccgcs
  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: jupyter.eurocc-gcs.de
          baseUrl: /
          loggerName: EuroCCGCS
        nfs:
          path: /nfs/hubs/rke2/production/euroccgcs
  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
        maintenance: "true-disab"
    helm:
      values:
        ingress:
          certmanager: false
        global:
          hostname: zam12154.zam.kfa-juelich.de
          # hostname: jupyter.eurocc-gcs.de
          baseUrl: /euroccgcs/
          loggerName: EuroCCGCS
          tlssecretname: zam12154
        nfs:
          path: /nfs/hubs/rke2/production/euroccgcs