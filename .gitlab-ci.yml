---
stages:
  - verify

yamllint:
  image: cytopia/yamllint:latest
  stage: verify
  script:
    - >
      yamllint -d '{extends: default, rules: {line-length: disable}, ignore: "**/specific-secrets/**"}' .

dryrun:
  image: alpine:latest
  stage: verify
  before_script:
    - apk add --no-cache bash curl git yq
    - curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | VERIFY_CHECKSUM=false bash
  script:
    - bash $CI_PROJECT_DIR/helm_dry.sh
