---
defaultNamespace: ebrains

labels:
  app: ebrains
  component: custom

dependsOn:
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces

helm:
  releaseName: ebrains-custom
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-hub-customizations
  version: 0.24.8
  values:
    fullnameOverride: ebrains-custom
    global:
      name: ebrains
      namespace: ebrains
    customConfig:
      userModules:
        kernels:
          pyneuroscience:
            default: true
    jupyter-metrics:
      enabled: true
      nodeSelector:
        worker: "true"
    logging:
      syslog:
        enabled: true
        level: 10
targetCustomizations:
  - name: jupyter-stag
    clusterSelector:
      matchLabels:
        stage: staging
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: twin-staging.ebrains.eu
          baseUrl: /
          loggerName: ebrainsStaging
        sidecarCheckInterval: 1200
        nfs:
          path: /nfs/hubs/rke2/staging/ebrains
  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: twin.ebrains.eu
          baseUrl: /
          loggerName: ebrains
        nfs:
          path: /nfs/hubs/rke2/production/ebrains
