---
defaultnamespace: ebrains

labels:
  app: ebrains
  component: z2jh

dependsOn:
  - selector:
      matchLabels:
        app: ebrains
        component: secrets
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces

kustomize:
  dir: ./kustomize
helm:
  releaseName: ebrains
  # repo: https://jupyterhub.github.io/helm-chart/
  # chart: jupyterhub
  # version: 3.1.0
  chart: https://github.com/jupyterhub/helm-chart/raw/gh-pages/jupyterhub-4.2.0.tgz
  values:
    ingress:
      # Set JupyterHub in maintenance:
      #   Set enabled here to false, update ingress in maintenance/fleet.yaml
      enabled: true
  valuesFiles:
    - ../../base-values/extraConfig.yaml
    # - ../../base-values/image_devel.yaml
    - ../../base-values/image.yaml
  valuesFrom:
    - configMapKeyRef:
        name: values
        namespace: ebrains
        key: values.yaml
    # - secretKeyRef:
    #    name: static-hub-secret
    #    namespace: ebrains
    #    key: values.yaml

targetCustomizations:
  - name: production
    clusterSelector:
      matchLabels:
        stage: production
        maintenance: "false"
    helm:
      valuesFiles:
        - ../../base-values/image_prod.yaml
        - ../../base-values/resources.yaml
  - name: production-maintenace
    clusterSelector:
      matchLabels:
        stage: production
        maintenance: "true"
    helm:
      valuesFiles:
        - ../../base-values/image_prod.yaml
        - ../../base-values/maintenance.yaml
