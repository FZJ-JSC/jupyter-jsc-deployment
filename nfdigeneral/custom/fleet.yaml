defaultNamespace: nfdigeneral

labels:
  app: nfdigeneral
  component: custom

dependsOn:
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces

helm:
  releaseName: nfdigeneral-custom
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-hub-customizations
  version: 0.16.29
  values:
    fullnameOverride: nfdigeneral-custom
    global:
      name: nfdigeneral
      namespace: nfdigeneral
    oauthSecret: hdfaai-credentials
    ingress:
      enabled: true
    dailyRestart:
      enabled: true
    jupyter-metrics:
      enabled: true
      nodeSelector:
        worker: "true"
    logging:
      syslog:
        enabled: true
        level: 10
    customConfig:
      services:
        JupyterLab:
          defaultOption: "4.3"
          default:
            enabled: true
            name: "Minimal JupyterLab"
            allowedLists:
              systems:
                - deNBI-Cloud
          "4.2":
            enabled: false
          "3.6":
            enabled: false
          custom:
            allowedLists:
              systems:
                - JSC-Cloud
                - deNBI-Cloud
          repo2docker:
            allowedLists:
              systems:
                - JSC-Cloud
                - deNBI-Cloud
      systems:
        - JSC-Cloud
        - deNBI-Cloud
targetCustomizations:
  - name: jupyter-stag
    clusterSelector:
      matchLabels:
        stage: staging
    helm:
      values:
        customConfig:
          systems:
            - JSC-Cloud
            - MPCDF
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          baseUrl: /
          loggerName: NFDIGeneralStaging
          hostname: hub-staging.nfdi-jupyter.de
        nfs:
          path: /nfs/hubs/rke2/staging/nfdigeneral
  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
    helm:
      values:
        customConfig:
          systems:
            - JSC-Cloud
            - deNBI-Cloud
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          baseUrl: /
          loggerName: NFDIGeneral
          hostname: hub.nfdi-jupyter.de
        nfs:
          path: /nfs/hubs/rke2/production/nfdigeneral
        redirectEditInPlace: "false"
        redirects:
          - name: "production-docs"
            oldHost: "docs.hub.nfdi-jupyter.de"
            newHost: "nfdi-jupyter.de"
          - name: "service-url"
            oldHost: "jupyter.services.base4nfdi.de"
            newHost: "nfdi-jupyter.de"
  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
        maintenance: "true-disabled"
    helm:
      values:
        ingress:
          certmanager: false
        global:
          hostname: zam12154.zam.kfa-juelich.de
          # hostname: hub.nfdi-jupyter.de
          baseUrl: /nfdigeneral/
          loggerName: NFDIGeneral
          tlssecretname: zam12154
        nfs:
          path: /nfs/hubs/rke2/production/nfdigeneral
