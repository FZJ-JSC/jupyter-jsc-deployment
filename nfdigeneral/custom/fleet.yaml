defaultNamespace: nfdigeneral

labels:
  app: nfdigeneral
  component: custom

dependsOn:
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces

helm:
  releaseName: nfdigeneral-custom
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-hub-customizations
  version: 0.15.7
  values:
    fullnameOverride: nfdigeneral-custom
    global:
      name: nfdigeneral
      namespace: nfdigeneral
    oauthSecret: hdfaai-credentials
    ingress:
      enabled: true
    jupyter-metrics:
      enabled: true
      nodeSelector:
        worker: "true"
    logging:
      syslog:
        enabled: true
        level: 10
    customConfig:
      services:
        defaultOption: "4.2"
      systems:
        - JSC-Cloud
        - MPCDF
targetCustomizations:
  - name: jupyter-stag
    clusterSelector:
      matchLabels:
        stage: staging
    helm:
      values:
        customConfig:
          announcement:
            show: true
            title: "Jupyter4NFDI - Staging Instance"
            body: "This instance is only used for testing."
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          baseUrl: /
          loggerName: NFDIGeneralStaging
          hostname: hub-staging.nfdi-jupyter.de
        nfs:
          path: /nfs/hubs/rke2/staging/nfdigeneral
  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
        prep: "false"
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          baseUrl: /
          loggerName: NFDIGeneral
          hostname: hub.nfdi-jupyter.de
        nfs:
          path: /nfs/hubs/rke2/production/nfdigeneral
  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
        prep: "true"
    helm:
      values:
        ingress:
          certmanager: false
        global:
          hostname: zam12185.zam.kfa-juelich.de
          # hostname: hub.nfdi-jupyter.de
          baseUrl: /nfdigeneral/
          loggerName: NFDIGeneral
          tlssecretname: zam12185
        nfs:
          path: /nfs/hubs/rke2/production/nfdigeneral