---
defaultNamespace: nfdigeneral

labels:
  app: nfdigeneral
  component: custom

dependsOn:
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces

helm:
  releaseName: nfdigeneral-custom
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-hub-customizations
  version: 0.24.13
  values:
    fullnameOverride: nfdigeneral-custom
    global:
      name: nfdigeneral
      namespace: nfdigeneral
    oauthSecret: infraproxy-credentials
    traefik:
      proxy: false
    dailyRestart:
      enabled: false
    jupyter-metrics:
      enabled: true
      nodeSelector:
        worker: "true"
    logging:
      syslog:
        enabled: true
        level: 10
    customConfig:
      services:
        JupyterLab:
          defaultOption: "default"
          default:
            enabled: true
            name: "JupyterLab"
            allowedLists:
              systems:
                - deNBI-Cloud
                - JSC-Cloud
          "4.3":
            name: "JupyterLab XL"
          "4.2":
            enabled: false
          "3.6":
            enabled: false
          custom:
            allowedLists:
              systems:
                - deNBI-Cloud
                - JSC-Cloud
          repo2docker:
            allowedLists:
              systems:
                - deNBI-Cloud
                - JSC-Cloud
      systems:
        - JSC-Cloud
        - deNBI-Cloud
targetCustomizations:
  - name: jupyter-stag
    clusterSelector:
      matchLabels:
        stage: staging
    helm:
      values:
        customConfig:
          systems:
            - JSC-Cloud
            - MPCDF
            - TUD-Cloud-Staging
            - TUD-HPC-Staging
            - GWDG-Staging
            - deNBI-Cloud
          systemsMaxPerUser:
            TUD-Cloud-Staging:
              default: 5
          services:
            JupyterLab:
              defaultOption: "default"
              default:
                enabled: true
                allowedLists:
                  systems:
                    - JSC-Cloud
                    - LRZ-Staging
                    - LRZ
                    - MPCDF
                    - TUD-Cloud-Staging
                    - TUD-HPC-Staging
                    - GWDG-Staging
                    - deNBI-Cloud
              "4.3":
                name: "JupyterLab XL"
                allowedLists:
                  groups:
                    - "geant:dfn.de:fz-juelich.de:jsc:jupyter:beta_tester"
              custom:
                allowedLists:
                  systems:
                    - JSC-Cloud
                    - LRZ-Staging
                    - LRZ
                    - MPCDF
                    - LocalDummy
                    - Dummy
                    - deNBI-Cloud
                    - TUD-Cloud-Staging
              repo2docker:
                allowedLists:
                  systems:
                    - JSC-Cloud
                    - LocalDummy
                    - Dummy
                    - deNBI-Cloud
          backendServices:
            outpostKubeMPCDF:
              flavorsRequired: true
            outpostKubeTUDCloudStaging:
              flavorsRequired: true
              userflavors: true
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          baseUrl: /
          loggerName: NFDIGeneralStaging
          hostname: hub-staging.nfdi-jupyter.de
        sidecarCheckInterval: 1200
        nfs:
          path: /nfs/hubs/rke2/staging/nfdigeneral
        livenessProbe:
          enabled: false
  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
        maintenance: "false"
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          baseUrl: /
          loggerName: NFDIGeneral
          hostname: hub.nfdi-jupyter.de
        nfs:
          path: /nfs/hubs/rke2/production/nfdigeneral
  - name: jupyter-prod-maintenance
    clusterSelector:
      matchLabels:
        stage: production
        maintenance: "true"
    helm:
      values:
        ingress:
          certmanager: false
        global:
          hostname: zam12154.zam.kfa-juelich.de
          # hostname: hub.nfdi-jupyter.de
          baseUrl: /nfdigeneral/
          loggerName: NFDIGeneral
          tlssecretname: zam12154
        nfs:
          path: /nfs/hubs/rke2/production/nfdigeneral
