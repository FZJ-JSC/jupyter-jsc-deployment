---
defaultNamespace: nfdigeneral

labels:
  app: nfdigeneral
  component: z2jh

dependsOn:
  - selector:
      matchLabels:
        app: nfdigeneral
        component: secrets
  - selector:
      matchLabels:
        app: postgres-operator
        component: namespaces

kustomize:
  dir: ./kustomize
helm:
  releaseName: nfdigeneral
  # repo: https://jupyterhub.github.io/helm-chart/
  # chart: jupyterhub
  # version: 3.1.0
  chart:
    https://github.com/jupyterhub/helm-chart/raw/gh-pages/jupyterhub-4.3.1.tgz
  valuesFiles:
    - ../../base-values/extraConfig.yaml
    - ../../base-values/image.yaml
  valuesFrom:
    - configMapKeyRef:
        name: values
        namespace: nfdigeneral
        key: values.yaml
    - secretKeyRef:
        name: static-hub-secret
        namespace: nfdigeneral
        key: values.yaml

targetCustomizations:
  - name: production
    clusterSelector:
      matchLabels:
        stage: production
    helm:
      valuesFiles:
        - ../../base-values/resources.yaml
        # - ../../base-values/image_devel.yaml
