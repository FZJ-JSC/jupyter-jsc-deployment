defaultNamespace: euroccgcs
labels:
  app: euroccgcs
  component: custom
helm:
  releaseName: euroccgcs-custom
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-hub-customizations
  version: 0.15.0-alpha.10
  values:
    fullnameOverride: euroccgcs-custom
    global:
      name: euroccgcs
      namespace: euroccgcs
    ingress:
      enabled: true
    jupyter-metrics:
      enabled: true
    logging:
      syslog:
        enabled: true
        level: 10
targetCustomizations:
  - name: jupyter-stag
    clusterSelector:
      matchLabels:
        name: jupyter-stag
    helm:
      values:
        global:
          hostname: zam12246.zam.kfa-juelich.de
          # hostname: jupyter-staging.eurocc-gcs.de
          baseUrl: /euroccgcs/
          loggerName: EuroCCGCSStaging
        nfs:
          path: /nfs/hubs/rke2/staging/euroccgcs
dependsOn:
  - selector:
      matchLabels:
        create-database: true