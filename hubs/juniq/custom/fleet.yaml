defaultNamespace: juniq
labels:
  app: juniq
  component: custom
helm:
  releaseName: juniq-custom
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-hub-customizations
  version: 0.15.0-alpha.10
  values:
    fullnameOverride: juniq-custom
    global:
      name: juniq
      namespace: juniq
    ingress:
      enabled: true
    jupyter-metrics:
      enabled: true
    logging:
      syslog:
        enabled: true
        level: 10
targetCustomizations:
  - name: jupyter-stag
    clusterSelector:
      matchLabels:
        name: jupyter-stag
    helm:
      values:
        global:
          hostname: zam12246.zam.kfa-juelich.de
          # hostname: juniq-staging.jsc.fz-juelich.de
          baseUrl: /juniq/
          loggerName: JuniqStaging
        nfs:
          path: /nfs/hubs/rke2/staging/juniq
dependsOn:
  - selector:
      matchLabels:
        jupyter-ready: "true"