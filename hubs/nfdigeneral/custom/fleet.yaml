defaultNamespace: jupyter
labels:
  app: nfdigeneral
  component: custom
helm:
  releaseName: nfdigeneral-custom
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-hub-customizations
  version: 0.12.7
  values:
    fullnameOverride: nfdigeneral-custom
    global:
      name: nfdigeneral
      namespace: jupyter
    oauthSecret: hdfaai-credentials
    customConfig:
      groups:
        default:
          services:
            JupyterLab:
              "4.2":
                maxPerUser: 5
              "custom":
                maxPerUser: 5
      services:
        defaultOption: "4.2"
      systems:
        - JSC-Cloud
    ingress:
      enabled: true
    jupyter-metrics:
      enabled: true
    logging:
      syslog:
        enabled: true
        level: 10
targetCustomizations:
  - name: staging
    clusterSelector:
      matchLabels:
        stage: staging
    helm:
      values:
        customConfig:
          announcement:
            show: true
            title: "Jupyter4NFDI - Staging Instance"
            body: "This instance is only used for testing."
        global:
          hostname: hub-staging.nfdi-jupyter.de
          loggerName: NFDIGeneralStaging
  - name: production
    clusterSelector:
      matchLabels:
        stage: production
    helm:
      values:
        global:
          hostname: hub.nfdi-jupyter.de
          loggerName: NFDIGeneralProduction
