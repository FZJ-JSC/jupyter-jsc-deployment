hub:
  #    mkdir -p /mnt/reservation_key &&
  #    cp -rp /mnt/reservation-keypair/..data/* /mnt/reservation_key/. &&
  #    chown 1000:1000 -R /mnt/reservation_key &&
  #    chmod 400 /mnt/reservation_key/* &&
  args:
    - -c
    - >-
      pip install --force-reinstall jupyterhub-forwardbasespawner jupyterhub-unicorespawner jupyterhub-outpostspawner &&
      pip install -i https://test.pypi.org/simple/ jupyter-jsc-custom==0.10.14.dev2 &&
      jupyterhub -f /usr/local/etc/jupyterhub/jupyterhub_config.py
  command:
    - /bin/bash
  image:
    pullPolicy: "Always"
    pullSecrets:
      - "gitlab-registry"
    name: registry.jsc.fz-juelich.de/jupyterjsc/k8s/images/jhub
    tag: 3.3.7.post6
  containerSecurityContext:
    runAsUser: 0
    runAsGroup: 0
    allowPrivilegeEscalation: true
