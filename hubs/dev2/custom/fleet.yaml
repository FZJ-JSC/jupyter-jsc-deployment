defaultNamespace: dev2
labels:
  app: dev2
  component: custom
helm:
  releaseName: dev2-custom
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-hub-customizations
  version: 0.15.0-alpha.10
  values:
    fullnameOverride: dev2-custom
    global:
      name: dev2
      namespace: dev2
      loggerName: JupyterDev2
    ingress:
      enabled: true
    jupyter-metrics:
      enabled: true
    logging:
      syslog:
        enabled: true
        level: 10
targetCustomizations:
  - name: jupyter-stag
    clusterSelector:
      matchLabels:
        name: jupyter-stag
    helm:
      values:
        global:
          hostname: zam12246.zam.kfa-juelich.de
          # hostname: jupyter-jsc-dev2.fz-juelich.de
          baseUrl: /dev2/
          loggerName: JupyterDev2
        nfs:
          path: /nfs/hubs/rke2/staging/coec