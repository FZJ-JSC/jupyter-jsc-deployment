defaultNamespace: dev2
labels:
  app: dev2
  component: custom
helm:
  releaseName: dev2-custom
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-hub-customizations
  version: 0.14.3
  values:
    fullnameOverride: dev2-custom
    global:
      name: dev2
      namespace: dev2
      hostname: jupyter-jsc-dev2.fz-juelich.de
      loggerName: JSCCloudDev2Staging
    customConfig:
      reservationCheck:
        addUsers: ["petrova1", "kreuzer1"]
        setAllActive: true
    ingress:
      enabled: true
    jupyter-metrics:
      enabled: true
    logging:
      syslog:
        enabled: true
        level: 10
targetCustomizations:
  - name: rke2-staging
    clusterSelector:
      matchLabels:
        name: jupyter-staging
    helm:
      values:
        global:
          hostname: zam12185.zam.kfa-juelich.de
          baseUrl: /dev2/
  - name: staging
    clusterSelector:
      matchLabels:
        stage: staging
    helm:
      values:
        customConfig:
          groups:
            default:
              services:
                JupyterLab:
                  custom:
                    maxPerUser: 5
            hifis:
              services:
                JupyterLab:
                  custom:
                    maxPerUser: 5
        global:
          hostname: jupyter-jsc-dev2.fz-juelich.de
  - name: production
    clusterSelector:
      matchLabels:
        stage: production
    doNotDeploy: true
    helm:
      values:
        global:
          hostname: zam12154.zam.kfa-juelich.de
          baseUrl: /dev2/
