defaultnamespace: dev2
labels:
  app: dev2
  component: z2jh
kustomize:
  dir: ./kustomize
helm:
  releaseName: dev2
  # repo: https://jupyterhub.github.io/helm-chart/
  # chart: jupyterhub
  # version: 3.1.0
  chart: https://github.com/jupyterhub/helm-chart/raw/gh-pages/jupyterhub-3.3.7.tgz
  values:
    nameOverride: "dev2"
    fullnameOverride: "dev2"
    ingress:
      # Set JupyterHub in maintenance:
      #   Set enabled here to false, update ingress in maintenance/fleet.yaml
      enabled: true
    hub:
      resources: {}
    proxy:
      chp:
        resources: {}
  valuesFiles:
    - ../../base-values/common.yaml
    - ../../base-values/proxy.yaml
    - ../../base-values/hub/config.yaml
    - ../../base-values/hub/image.yaml
    - ../../base-values/hub/extraConfig.yaml
    - ../../base-values/hub/extraVolumeMounts.yaml
    - ../../base-values/hub/others.yaml
    - ../../base-values/hub/services.yaml
  valuesFrom:
    - configMapKeyRef:
        name: dev2-values
        namespace: dev2
        key: values.yaml
targetCustomizations:
  - name: production
    clusterSelector:
      matchLabels:
        stage: production
    doNotDeploy: true

dependsOn:
  - selector:
      matchLabels:
        app: dev2
        component: custom
