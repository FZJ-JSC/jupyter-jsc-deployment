defaultNamespace: dev1
doNotDeploy: true
labels:
  app: dev1
  component: custom
helm:
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-hub-customizations
  version: 0.15.0
  values:
    customConfig:
      reservationCheck:
        addUsers: ["petrova1", "kreuzer1"]
        setAllActive: true
    fullnameOverride: dev1-custom
    global:
      name: dev1
      namespace: dev1
    ingress:
      enabled: true
    jupyter-metrics:
      enabled: true
    logging:
      syslog:
        enabled: true
        level: 10
targetCustomizations:
  - name: jupyter-stag
    clusterSelector:
      matchLabels:
        stage: staging
    doNotDeploy: false
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: jupyter-jsc-dev1.fz-juelich.de
          baseUrl: /
          loggerName: JupyterDev1
        nfs:
          path: /nfs/hubs/rke2/staging/dev1

dependsOn:
  - selector:
      matchLabels:
        create-namespaces: "true"