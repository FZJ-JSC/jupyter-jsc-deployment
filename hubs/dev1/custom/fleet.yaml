defaultNamespace: dev1
labels:
  app: dev1
  component: custom
helm:
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-hub-customizations
  version: 0.15.0-alpha.10
  values:
    customConfig:
      reservationCheck:
        addUsers: ["petrova1", "kreuzer1"]
        setAllActive: true
    fullnameOverride: dev1-custom
    global:
      name: dev1
      namespace: dev1
      hostname: jupyter-jsc-dev1.fz-juelich.de
      loggerName: JSCCloudDev1Staging
    ingress:
      enabled: true
    jupyter-metrics:
      enabled: true
    logging:
      syslog:
        enabled: true
        level: 10
targetCustomizations:
  - name: jupyter-stag
    clusterSelector:
      matchLabels:
        name: jupyter-stag
    helm:
      values:
        global:
          hostname: zam12246.zam.kfa-juelich.de
          baseUrl: /dev1/
        nfs:
          path: /nfs/hubs/rke2/staging/dev1
  - name: staging
    clusterSelector:
      matchLabels:
        stage: staging
    helm:
      values:
        global:
          hostname: jupyter-jsc-dev1.fz-juelich.de
  - name: production
    clusterSelector:
      matchLabels:
        stage: production
    doNotDeploy: true
    helm:
      values:
        global:
          hostname: zam12154.zam.kfa-juelich.de
          baseUrl: /dev1/
