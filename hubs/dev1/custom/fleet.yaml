defaultNamespace: dev1
labels:
  app: dev1
  component: custom
helm:
  releaseName: dev1-custom
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-hub-customizations
  version: 0.14.2
  values:
    customConfig:
      reservationCheck:
        addUsers: ["petrova1", "kreuzer1"]
        setAllActive: true
      backendServices:
        outpostKubeJSCCloud:
          flavorsRequired: true
          userflavors: true
      authStateKeys:
        - services
        - userModules
        - announcement
        - groups
        - systems
        - incidentCheck
        - backendServices
    fullnameOverride: dev1-custom
    global:
      name: dev1
      namespace: dev1
      hostname: jupyter-jsc-dev1.fz-juelich.de
      loggerName: JSCCloudDev1Staging
    ingress:
      enabled: true
    jupyter-metrics:
      enabled: true
    logging:
      syslog:
        enabled: true
        level: 10
targetCustomizations:
  - name: rke2-staging
    clusterSelector:
      matchLabels:
        name: jupyter-staging
    helm:
      values:
        global:
          hostname: zam12185.zam.kfa-juelich.de
  - name: staging
    clusterSelector:
      matchLabels:
        stage: staging
    helm:
      values:
        global:
          hostname: jupyter-jsc-dev1.fz-juelich.de
  - name: production
    clusterSelector:
      matchLabels:
        stage: production
    doNotDeploy: true
    helm:
      values:
        global:
          hostname: zam12154.zam.kfa-juelich.de
          baseUrl: /dev1/
