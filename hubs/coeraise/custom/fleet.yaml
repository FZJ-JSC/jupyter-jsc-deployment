defaultNamespace: coeraise
labels:
  app: coeraise
  component: custom
helm:
  releaseName: coeraise-custom
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-hub-customizations
  version: 0.15.0-alpha.10
  values:
    fullnameOverride: coeraise-custom
    global:
      name: coeraise
      namespace: coeraise
    ingress:
      enabled: true
    jupyter-metrics:
      enabled: true
    logging:
      syslog:
        enabled: true
        level: 10
targetCustomizations:
  - name: jupyter-stag
    clusterSelector:
      matchLabels:
        name: jupyter-stag
    helm:
      values:
        global:
          hostname: zam12246.zam.kfa-juelich.de
          # hostname: jupyter-staging.coe-raise.eu
          baseUrl: /coeraise/
          loggerName: CoeRaiseStaging
        nfs:
          path: /nfs/hubs/rke2/staging/coeraise
dependsOn:
  - selector:
      matchLabels:
        jupyter-ready: "true"