defaultNamespace: coec
labels:
  app: coec
  component: custom
helm:
  releaseName: coec-custom
  repo: https://kaas.pages.jsc.fz-juelich.de/helm-charts
  chart: jupyter-hub-customizations
  version: 0.15.0
  values:
    fullnameOverride: coec-custom
    global:
      name: coec
      namespace: coec
    ingress:
      enabled: true
    jupyter-metrics:
      enabled: true
    logging:
      syslog:
        enabled: true
        level: 10
targetCustomizations:
  - name: jupyter-stag
    clusterSelector:
      matchLabels:
        stage: staging
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: jupyter-coec-staging.jsc.fz-juelich.de
          baseUrl: /
          loggerName: CoeCStaging
        nfs:
          path: /nfs/hubs/rke2/staging/coec
  - name: jupyter-prod
    clusterSelector:
      matchLabels:
        stage: production
    helm:
      values:
        global:
          # hostname: zam12246.zam.kfa-juelich.de
          hostname: jupyter-coec.jsc.fz-juelich.de
          baseUrl: /
          loggerName: CoeC
        nfs:
          path: /nfs/hubs/rke2/production/coec
dependsOn:
  - selector:
      matchLabels:
        create-namespaces: "true"