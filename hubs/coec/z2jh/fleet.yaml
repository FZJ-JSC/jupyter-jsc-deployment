defaultnamespace: coec
labels:
  app: coec
  component: z2jh
kustomize:
  dir: ./kustomize
helm:
  releaseName: coec
  # repo: https://jupyterhub.github.io/helm-chart/
  # chart: jupyterhub
  # version: 3.1.0
  chart: https://github.com/jupyterhub/helm-chart/raw/gh-pages/jupyterhub-3.3.7.tgz
  values:
    ingress:
      # Set JupyterHub in maintenance:
      #   Set enabled here to false, update ingress in maintenance/fleet.yaml
      enabled: true
  valuesFiles:
    - ../../base-values/extraConfig.yaml
    - ../../base-values/image.yaml
  valuesFrom:
    - configMapKeyRef:
        name: values
        namespace: coec
        key: values.yaml

targetCustomizations:
  - name: production
    clusterSelector:
      matchLabels:
        stage: production
    kustomize:
      dir: ./kustomize_production
    helm:
      valuesFiles:
        - ../../base-values/hub/image_fixed.yaml

dependsOn:
  - selector:
      matchLabels:
        app: coec
        component: custom